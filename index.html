<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendario Pro</title>
<meta name="theme-color" content="#4f6bff">
<meta name="description" content="Calendario con recordatorios, tareas y notas. Funciona sin internet.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f6bff'/%3E%3Crect x='14' y='18' width='36' height='32' rx='5' fill='none' stroke='white' stroke-width='4'/%3E%3Cpath d='M14 28h36M23 12v10M41 12v10' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M25 40l5 5 9-10' fill='none' stroke='white' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f5fa; --surface:#ffffff; --surface2:#eef0f7; --border:#e2e5ef; --text:#1b1f33; --muted:#6a7291;
  --accent:#4f6bff; --accent-soft:rgba(79,107,255,.12); --danger:#e5484d; --danger-soft:rgba(229,72,77,.12); --ok:#2fb573;
  --shadow:0 1px 2px rgba(20,25,60,.06),0 10px 30px rgba(20,25,60,.10); --radius:12px;
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --hh:56px;
}
[data-theme=dark]{
  --bg:#0e1019; --surface:#161927; --surface2:#1e2233; --border:#2a2f45; --text:#e9ebf7; --muted:#8e96b8;
  --accent:#7b8dff; --accent-soft:rgba(123,141,255,.16); --danger:#ff6b70; --danger-soft:rgba(255,107,112,.14);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 36px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:14px;height:14px}

/* layout */
#app{display:grid;grid-template-columns:276px minmax(0,1fr);height:100vh;height:100dvh}
#sidebar{background:var(--surface);border-right:1px solid var(--border);padding:16px 14px;display:flex;flex-direction:column;gap:16px;overflow-y:auto;min-height:0}
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#scrim{display:none}
.brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:600;letter-spacing:-.01em;padding:2px 4px}
.brand b{color:var(--accent)}
.logo{width:32px;height:32px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center}
.logo svg{width:18px;height:18px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 13px;border:1px solid var(--border);background:var(--surface);border-radius:9px;font-weight:500;line-height:1.2;white-space:nowrap;transition:background .12s,filter .12s}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.1);background:var(--accent)}
.btn.danger{color:var(--danger);border-color:transparent;background:var(--danger-soft)}
.btn.danger:hover{background:var(--danger-soft);filter:brightness(.96)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface2);color:var(--text)}
.btn.big{padding:10px 14px;font-size:14px;width:100%}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;border:0;background:transparent;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--surface2);color:var(--text)}
.icon-btn.sm{width:26px;height:26px;border-radius:7px}
input[type=text],input[type=date],input[type=time],input[type=search],select,textarea,input:not([type]){background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:8px 10px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent)}
textarea{resize:vertical;width:100%}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* sidebar bits */
.mc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;padding:0 2px}
.mc-head b{font-size:13.5px}
.mc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;text-align:center}
.mc-grid i{font-style:normal;font-size:11px;color:var(--muted);padding:4px 0}
.mc-day{position:relative;border:0;background:transparent;border-radius:50%;aspect-ratio:1;font-size:12px;color:var(--text);padding:0;display:grid;place-items:center}
.mc-day:hover{background:var(--surface2)}
.mc-day.other{color:var(--muted);opacity:.55}
.mc-day.today{background:var(--accent);color:#fff;font-weight:700}
.mc-day.sel:not(.today){box-shadow:inset 0 0 0 1.5px var(--accent)}
.mc-day u{position:absolute;bottom:2px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.mc-day.today u{background:#fff}
.sb-title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:0 2px 6px;display:flex;justify-content:space-between;align-items:center}
.up-item{display:flex;gap:9px;padding:6px 6px;border-radius:8px;cursor:pointer;align-items:flex-start}
.up-item:hover{background:var(--surface2)}
.up-dot{width:8px;height:8px;border-radius:3px;background:var(--c);margin-top:5px;flex:none}
.up-t{font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up-s{font-size:11.5px;color:var(--muted)}
.empty-s{font-size:12.5px;color:var(--muted);padding:2px 6px}
.cat-row{display:flex;align-items:center;gap:9px;padding:5px 6px;border-radius:8px;cursor:pointer;user-select:none}
.cat-row:hover{background:var(--surface2)}
.cat-row .sw{width:14px;height:14px;border-radius:4px;border:2px solid var(--c);background:var(--c);flex:none}
.cat-row.off .sw{background:transparent}
.cat-row.off span:last-child{color:var(--muted);text-decoration:line-through}
.sb-foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:8px}

/* topbar */
#topbar{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--border);background:var(--surface)}
.tabs{display:flex;gap:4px}
.tab{display:flex;align-items:center;gap:7px;border:0;background:transparent;padding:8px 13px;border-radius:9px;color:var(--muted);font-weight:500}
.tab:hover{background:var(--surface2);color:var(--text)}
.tab.on{background:var(--accent-soft);color:var(--accent)}
.badge{background:var(--danger);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;line-height:17px;min-width:17px;text-align:center;font-weight:600}
.spacer{flex:1}
.search{position:relative;width:min(340px,38vw)}
.search input{width:100%;padding-left:34px;background:var(--surface2);border-color:transparent}
.search .i{position:absolute;left:10px;top:9px;color:var(--muted);pointer-events:none}
#searchRes{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;z-index:50;padding:6px}
.sr-h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:6px 8px 2px;font-weight:600}
.sr-i{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer}
.sr-i:hover{background:var(--surface2)}
.sr-i small{color:var(--muted);margin-left:auto;white-space:nowrap}
.only-narrow{display:none}
#banner .bn{display:flex;align-items:center;gap:12px;background:var(--accent-soft);color:var(--text);padding:9px 18px;border-bottom:1px solid var(--border)}
#banner .bn span{flex:1}

/* headers */
.head{padding:14px 18px 10px;display:flex;flex-direction:column;gap:10px}
.tool-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.nav{display:flex;align-items:center;gap:6px;min-width:0}
.nav h1,.head h1{font-size:20px;margin:0 0 0 8px;font-weight:650;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quick-wrap{position:relative}
.quick-wrap input{width:100%;padding:11px 14px;border-radius:11px;font-size:14.5px;background:var(--surface);box-shadow:0 1px 2px rgba(20,25,60,.05)}
.qprev{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;min-height:0}
.qprev:empty{display:none}
.qp{display:inline-flex;align-items:center;gap:5px;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:500}
.qp.t{background:var(--surface2);color:var(--text)}
.qp.warn{background:var(--danger-soft);color:var(--danger)}

#view{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
.pad{padding:6px 18px 24px}

/* month */
.month{flex:1;display:flex;flex-direction:column;min-height:420px;margin:0 18px 18px;border:1px solid var(--border);border-radius:14px;background:var(--surface);overflow:hidden}
.m-dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--border);background:var(--surface)}
.m-dow div{padding:8px 6px;text-align:center;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.m-grid{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-height:0}
.cell{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:4px 5px 3px;min-width:0;min-height:0;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;gap:2px;position:relative}
.cell:nth-child(7n){border-right:0}
.cell.other{background:color-mix(in srgb,var(--surface2) 55%,var(--surface))}
.cell.other .dnum{color:var(--muted)}
.cell:hover{background:var(--surface2)}
.cell.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cell.drop{background:var(--accent-soft)}
.cell-head{display:flex;justify-content:space-between;align-items:center;flex:none}
.dnum{min-width:26px;height:26px;padding:0 4px;display:grid;place-items:center;border-radius:13px;font-size:12.5px;font-weight:600;cursor:pointer}
.dnum:hover{background:var(--accent-soft);color:var(--accent)}
.cell.today .dnum{background:var(--accent);color:#fff}
.chips{display:flex;flex-direction:column;gap:2px;min-height:0}
.chip{font-size:12px;line-height:1.35;padding:1px 6px;border-radius:5px;background:var(--cb);border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;flex:none}
.chip:hover{filter:brightness(.95)}
.chip .tm{color:var(--muted);margin-right:3px;font-variant-numeric:tabular-nums}
.chip.cont{border-left-width:0;border-top-left-radius:0;border-bottom-left-radius:0;margin-left:-5px;padding-left:9px}
.chip.task .tk{display:inline-block;width:11px;height:11px;border:1.5px solid var(--c);border-radius:3px;margin-right:4px;vertical-align:-1px}
.chip.task.done{opacity:.55;text-decoration:line-through}
.chip.task.done .tk{background:var(--c)}
.more{font-size:11.5px;color:var(--muted);padding:0 6px;cursor:pointer;flex:none}
.more:hover{color:var(--accent)}
.dots{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;margin-top:2px}
.dots u{width:6px;height:6px;border-radius:50%;background:var(--c)}

/* time grid */
.tg{flex:1;min-height:0;margin:0 18px 18px;border:1px solid var(--border);border-radius:14px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column}
.tg-scroll{flex:1;overflow:auto;position:relative;--headh:54px}
.tg-row{display:grid;grid-template-columns:58px repeat(var(--n),minmax(0,1fr))}
.tg-head{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--border);height:var(--headh)}
.tg-day{display:flex;flex-direction:column;align-items:center;justify-content:center;border-left:1px solid var(--border);cursor:pointer;gap:1px}
.tg-day .dw{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.tg-day .dn{font-size:17px;font-weight:650;width:30px;height:30px;display:grid;place-items:center;border-radius:15px}
.tg-day.today .dn{background:var(--accent);color:#fff}
.tg-day.today .dw{color:var(--accent)}
.tg-allday{position:sticky;top:var(--headh);z-index:4;background:var(--surface);border-bottom:1px solid var(--border);min-height:30px}
.tg-allday .gut{font-size:10.5px;color:var(--muted);padding:8px 6px 0 0;text-align:right;line-height:1.1}
.ad-col{border-left:1px solid var(--border);padding:3px;display:flex;flex-direction:column;gap:2px;min-width:0;cursor:pointer}
.tg-grid{height:calc(24 * var(--hh));position:relative}
.gut{position:relative}
.hl{position:absolute;right:8px;transform:translateY(-50%);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tg-col{position:relative;border-left:1px solid var(--border);background-image:linear-gradient(var(--border) 1px,transparent 1px);background-size:100% var(--hh);cursor:pointer;min-width:0}
.tg-col.today{background-color:var(--accent-soft)}
.blk{position:absolute;padding:2px 6px;border-radius:7px;background:var(--cb);border-left:3px solid var(--c);overflow:hidden;font-size:12px;line-height:1.3;cursor:pointer;box-shadow:0 0 0 1px var(--surface)}
.blk:hover{filter:brightness(.95);z-index:3}
.blk b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk small{color:var(--muted);font-size:11px}
.blk.done{opacity:.55;text-decoration:line-through}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--danger);z-index:4;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--danger)}

/* agenda / lists */
.ag-day{margin:0 18px 14px}
.ag-h{font-weight:650;font-size:14px;padding:6px 2px;display:flex;gap:8px;align-items:baseline;position:sticky;top:0;background:var(--bg);z-index:2}
.ag-h small{color:var(--muted);font-weight:400}
.ag-h.today{color:var(--accent)}
.ag-list{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.row-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;position:relative}
.row-item:last-child{border-bottom:0}
.row-item:hover{background:var(--surface2)}
.row-item .bar{width:4px;align-self:stretch;border-radius:4px;background:var(--c);flex:none}
.row-item .rt{width:108px;flex:none;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.row-item .rb{min-width:0;flex:1}
.rtitle{font-weight:550;overflow:hidden;text-overflow:ellipsis}
.rtitle.done{text-decoration:line-through;color:var(--muted)}
.rsub{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:60px 20px}
.empty .i{width:40px;height:40px;opacity:.4;margin-bottom:10px}
.cb{width:20px;height:20px;border-radius:6px;border:2px solid var(--muted);display:grid;place-items:center;flex:none;background:transparent;padding:0;color:#fff}
.cb.on{background:var(--ok);border-color:var(--ok)}
.cb .i{width:13px;height:13px;stroke-width:3;opacity:0}
.cb.on .i{opacity:1}
.tchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.tc{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;background:var(--surface2);border-radius:99px;padding:1px 8px;color:var(--muted)}
.tc.over{background:var(--danger-soft);color:var(--danger)}
.tc.p1{color:#d98a00}.tc.p2{color:var(--danger)}
.task-h{margin:16px 2px 6px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:650}
.task-h.over{color:var(--danger)}

/* notes */
.notes{flex:1;min-height:0;display:grid;grid-template-columns:300px minmax(0,1fr);margin:6px 18px 18px;border:1px solid var(--border);border-radius:14px;background:var(--surface);overflow:hidden}
.n-side{border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.n-tools{display:flex;gap:8px;padding:10px;border-bottom:1px solid var(--border)}
.n-tools input{flex:1}
#nList{overflow:auto;flex:1;padding:6px}
.n-item{padding:10px 11px;border-radius:10px;cursor:pointer;margin-bottom:2px}
.n-item:hover{background:var(--surface2)}
.n-item.on{background:var(--accent-soft)}
.n-item b{display:flex;gap:6px;align-items:center;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.n-item p{margin:2px 0 0;color:var(--muted);font-size:12.5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.n-item small{color:var(--muted);font-size:11px}
.n-main{display:flex;flex-direction:column;min-height:0;min-width:0}
.n-bar{display:flex;align-items:center;gap:6px;padding:8px 14px;border-bottom:1px solid var(--border);color:var(--muted);font-size:12px}
.n-bar .spacer{flex:1}
#noteTitle{border:0;font-size:22px;font-weight:650;padding:16px 20px 4px;letter-spacing:-.01em;background:transparent;border-radius:0;box-shadow:none!important}
#noteBody{flex:1;border:0;resize:none;padding:8px 20px 20px;line-height:1.6;font-size:15px;background:transparent;border-radius:0;box-shadow:none!important;min-height:0}
.back-btn{display:none}

/* dialogs */
dialog{border:0;padding:0;border-radius:18px;background:var(--surface);color:var(--text);box-shadow:var(--shadow);width:min(580px,calc(100vw - 20px));max-height:calc(100dvh - 24px);overflow:hidden}
dialog[open]{display:flex}
dialog::backdrop{background:rgba(8,10,22,.55);backdrop-filter:blur(2px)}
dialog.sm{width:min(420px,calc(100vw - 20px))}
.modal{display:flex;flex-direction:column;width:100%;min-height:0;max-height:calc(100dvh - 24px)}
.modal-head{display:flex;align-items:center;gap:8px;padding:14px 14px 4px 18px}
.modal-head h2{margin:0;font-size:17px;flex:1}
.title-input{flex:1;font-size:20px!important;font-weight:600;border:0!important;border-bottom:2px solid var(--border)!important;border-radius:0!important;padding:8px 2px!important;box-shadow:none!important;background:transparent!important}
.title-input:focus{border-bottom-color:var(--accent)!important}
.modal-body{padding:10px 18px 6px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal-foot{display:flex;gap:8px;padding:12px 18px 16px;align-items:center;flex-wrap:wrap}
.modal-foot .spacer{flex:1}
.modal p{margin:0;color:var(--muted)}
.frow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.frow.top{align-items:flex-start}
.ficon{color:var(--muted);width:20px;display:grid;place-items:center;flex:none}
.dtpair{display:flex;gap:6px;flex-wrap:wrap}
.dash{color:var(--muted)}
.chk{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{position:relative;cursor:pointer}
.pill input{position:absolute;opacity:0}
.pill span{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;border:1.5px solid var(--border);font-size:13px}
.pill span::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--c)}
.pill input:checked+span{border-color:var(--c);background:var(--cb);font-weight:600}
.pill input:focus-visible+span{box-shadow:0 0 0 3px var(--accent-soft)}
.rem-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
.field>label,.lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.set-sec{display:flex;flex-direction:column;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.set-sec:last-child{border-bottom:0}
.set-sec h3{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.steps{margin:4px 0;padding-left:20px;display:flex;flex-direction:column;gap:10px}
.steps a{color:var(--accent);font-weight:600}
code{background:var(--surface2);padding:1px 6px;border-radius:5px;font-size:12.5px}
.wa-row{display:flex;gap:6px;flex-wrap:wrap}
.wa-preview{margin:0;padding:12px;background:var(--surface2);border-radius:10px;white-space:pre-wrap;font:inherit;font-size:13.5px;max-height:180px;overflow:auto}
.person{border:1px solid var(--border);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.p-top{display:flex;gap:8px;align-items:center}
.p-top input[type=text]{flex:1;font-weight:600}
.code-row{display:flex;gap:6px;flex-wrap:wrap}
.code-row input{flex:1 1 190px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
#phoneFoot{color:var(--text)}
.cat-edit{display:flex;gap:8px;align-items:center}
.cat-edit input[type=color]{width:34px;height:34px;padding:2px;border-radius:9px;border:1px solid var(--border);background:var(--surface);flex:none}
.cat-edit input[type=text]{flex:1}

/* toasts & alerts */
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:200;align-items:center;pointer-events:none}
.toast{background:#1b1f33;color:#fff;padding:10px 16px;border-radius:11px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:center;pointer-events:auto;animation:up .2s ease}
.toast button{background:transparent;border:0;color:#9db0ff;font-weight:600;padding:0}
.toast.out{opacity:0;transition:opacity .3s}
#alerts{position:fixed;top:14px;right:14px;display:flex;flex-direction:column;gap:10px;z-index:150;width:min(380px,calc(100vw - 28px))}
.alert{background:var(--surface);border:1px solid var(--border);border-left:5px solid var(--c);border-radius:14px;box-shadow:var(--shadow);padding:14px 14px 12px;animation:slide .25s ease}
.alert .ah{display:flex;gap:10px;align-items:flex-start}
.alert .ah .bell{color:var(--c);margin-top:2px;animation:ring 1s ease 2}
.alert .at{font-weight:650;font-size:15px;word-break:break-word}
.alert .as{color:var(--muted);font-size:12.5px;margin-top:1px}
.alert .ab{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}
.alert .ab .btn{padding:5px 10px;font-size:12.5px}
.alert .ab .lbl2{font-size:12px;color:var(--muted);margin-right:2px}
.fab{display:none}
@keyframes up{from{transform:translateY(10px);opacity:0}}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(16deg)}40%{transform:rotate(-14deg)}60%{transform:rotate(10deg)}80%{transform:rotate(-6deg)}}

/* responsive */
@media (max-width:900px){
  #app{grid-template-columns:1fr}
  #sidebar{position:fixed;left:0;top:0;bottom:0;width:284px;z-index:90;transform:translateX(-102%);transition:transform .22s ease;box-shadow:var(--shadow)}
  body.sb-open #sidebar{transform:none}
  body.sb-open #scrim{display:block;position:fixed;inset:0;background:rgba(8,10,22,.45);z-index:80}
  .only-narrow{display:grid}
  .search{width:auto;flex:1}
}
@media (max-width:700px){
  #topbar{padding:8px 10px;gap:6px}
  .tab span.tl{display:none}
  .tab{padding:8px 10px}
  .head{padding:10px 12px 8px}
  .nav h1,.head h1{font-size:17px}
  .month,.tg{margin:0 8px 8px;border-radius:12px}
  .month{min-height:0;flex:none}
  .m-grid{grid-auto-rows:minmax(52px,auto)}
  .cell{padding:3px 2px;align-items:center}
  .cell .chips,.cell .more{display:none}
  .pad,.ag-day{padding-left:10px;padding-right:10px;margin-left:0;margin-right:0}
  .row-item .rt{width:82px}
  .fab{display:grid;position:fixed;right:16px;bottom:18px;width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;border:0;place-items:center;box-shadow:var(--shadow);z-index:60}
  .fab .i{width:24px;height:24px}
  .notes{grid-template-columns:1fr;margin:0 8px 8px}
  .notes .n-main{display:none}
  .notes.show-editor .n-side{display:none}
  .notes.show-editor .n-main{display:flex}
  .back-btn{display:grid}
  .seg button{padding:6px 9px}
}
@media print{#sidebar,#topbar,.head,#alerts,#toasts{display:none!important}body{overflow:visible}#app{display:block;height:auto}}
</style>

<body>
<noscript>Calendario Pro necesita JavaScript activado para funcionar.</noscript>
<div id="app">
  <div id="scrim" data-act="close-sidebar"></div>
  <aside id="sidebar" aria-label="Panel lateral">
    <div class="brand"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4M9 15l2.2 2.2L15.5 13"/></svg></span><span>Calendario <b>Pro</b></span></div>
    <button class="btn primary big" data-act="new-event" id="newEventBtn"></button>
    <div id="miniCal"></div>
    <div><div class="sb-title">Próximamente</div><div id="upcoming"></div></div>
    <div><div class="sb-title"><span>Categorías</span><button class="icon-btn sm" data-act="settings" title="Editar categorías"></button></div><div id="cats"></div></div>
    <div class="sb-foot" id="sbFoot"></div>
  </aside>

  <main id="main">
    <header id="topbar">
      <button class="icon-btn only-narrow" data-act="toggle-sidebar" id="menuBtn" aria-label="Menú"></button>
      <nav class="tabs" id="tabs"></nav>
      <div class="spacer"></div>
      <div class="search">
        <span id="searchIcon"></span>
        <input type="search" id="search" placeholder="Buscar  ( / )" autocomplete="off" aria-label="Buscar">
        <div id="searchRes" hidden></div>
      </div>
      <button class="icon-btn" data-act="toggle-theme" id="themeBtn" title="Cambiar tema"></button>
      <button class="icon-btn" data-act="settings" id="setBtn" title="Ajustes y copia de seguridad"></button>
    </header>
    <div id="banner"></div>

    <div id="calHead" class="head">
      <div class="tool-row">
        <div class="nav">
          <button class="btn" data-act="today">Hoy</button>
          <button class="icon-btn" data-act="prev" id="prevBtn" aria-label="Anterior"></button>
          <button class="icon-btn" data-act="next" id="nextBtn" aria-label="Siguiente"></button>
          <h1 id="calTitle"></h1>
        </div>
        <div class="seg" id="viewSeg"></div>
      </div>
      <div class="quick-wrap">
        <input id="quick" type="text" placeholder="Escribe rápido: «Dentista mañana 4pm» o «Reunión el viernes 10am cada semana»" autocomplete="off">
        <div class="qprev" id="quickPrev"></div>
      </div>
    </div>

    <div id="taskHead" class="head" hidden>
      <div class="tool-row"><h1 style="margin-left:0">Tareas</h1><div class="seg" id="taskSeg"></div></div>
      <div class="quick-wrap">
        <input id="taskQuick" type="text" placeholder="Nueva tarea… (ej: «Pagar el arriendo el 5 a las 9am»)" autocomplete="off">
        <div class="qprev" id="taskPrev"></div>
      </div>
    </div>

    <section id="view" aria-live="polite"></section>
  </main>
</div>
<button class="fab" data-act="new-event" id="fab" aria-label="Nuevo evento"></button>
<dialog id="dlg"></dialog>
<div id="alerts" aria-live="assertive"></div>
<div id="toasts"></div>

<script>
(() => {
'use strict';

/* =====================================================================
   Utilidades
   ===================================================================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const fmtDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseDate(s); d.setDate(d.getDate() + n); return fmtDate(d); };
const diffDays = (a, b) => Math.round((parseDate(b) - parseDate(a)) / 864e5);
const today = () => fmtDate(new Date());
const toMin = t => { const [h, m] = String(t).split(':').map(Number); return h * 60 + (m || 0); };
const fromMin = m => { m = Math.max(0, Math.min(1439, m)); return `${pad(Math.floor(m / 60))}:${pad(m % 60)}`; };
const plus = (t, mins) => fromMin(toMin(t) + mins);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const clone = o => JSON.parse(JSON.stringify(o));
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };

const DAY_S = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const DAY_L = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const WDN = ['domingo', 'lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado'];
const MON_L = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const MON_S = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const HH = 56;
const DAY_MS = 864e5;
const REM_OPTS = [0, 5, 10, 15, 30, 60, 120, 1440, 2880, 10080];
const REPEATS = [['none', 'No se repite'], ['daily', 'Todos los días'], ['weekdays', 'Lunes a viernes'], ['weekly', 'Cada semana'], ['biweekly', 'Cada 2 semanas'], ['monthly', 'Cada mes'], ['yearly', 'Cada año']];
const REPEAT_TXT = { daily: 'Todos los días', weekdays: 'Lunes a viernes', weekly: 'Cada semana', biweekly: 'Cada 2 semanas', monthly: 'Cada mes', yearly: 'Cada año' };
const PALETTE = ['#4f6bff', '#ef6c57', '#f5a524', '#2fb573', '#a855f7', '#ec4899', '#14b8a6', '#64748b'];

const ICON = {
  left: '<polyline points="15 18 9 12 15 6"/>', right: '<polyline points="9 18 15 12 9 6"/>',
  plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  search: '<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
  sliders: '<line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>',
  bell: '<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',
  cal: '<rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
  tasks: '<polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  note: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>',
  trash: '<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',
  x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  menu: '<line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>',
  moon: '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>',
  sun: '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>',
  repeat: '<polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>',
  pin: '<line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24z"/>',
  copy: '<rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  flag: '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/>',
  clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  pinmap: '<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',
  down: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
  up: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>',
  check: '<polyline points="20 6 9 17 4 12"/>',
  edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"/>'
};
const ic = (n, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;

/* =====================================================================
   Estado y almacenamiento
   ===================================================================== */
const KEY = 'calendario-pro:v1';
let S;
let storageOK = true;
const is12h = () => { try { return !!new Intl.DateTimeFormat(undefined, { hour: 'numeric' }).resolvedOptions().hour12; } catch (e) { return false; } };

function defaults() {
  return {
    v: 1, events: [], tasks: [], notes: [], fired: {}, snoozes: [],
    phone: { on: false, server: 'https://ntfy.sh', people: [], sched: {} },
    sync: { on: false, token: '', gist: '', key: '', api: '', etag: '', last: 0, first: false, pending: false, upd: {}, sig: {}, del: {}, bupd: {}, bsig: {} },
    categories: [
      { id: 'personal', name: 'Personal', color: '#4f6bff' },
      { id: 'trabajo', name: 'Trabajo', color: '#ef6c57' },
      { id: 'estudio', name: 'Estudio', color: '#a855f7' },
      { id: 'salud', name: 'Salud', color: '#2fb573' },
      { id: 'familia', name: 'Familia', color: '#ec4899' },
      { id: 'otros', name: 'Otros', color: '#64748b' }
    ],
    settings: { theme: 'auto', weekStart: 1, view: 'month', sound: true, notify: true, defaultReminder: 10, allDayHour: 9, hour12: is12h(), lastBackup: 0, hiddenCats: [], showTasks: true, lastCat: '', waContacts: [], created: Date.now() }
  };
}

function load() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { storageOK = false; }
  if (raw) {
    try {
      const o = JSON.parse(raw), d = defaults();
      S = Object.assign(d, o);
      S.settings = Object.assign(defaults().settings, o.settings || {});
      ['events', 'tasks', 'notes', 'snoozes'].forEach(k => { if (!Array.isArray(S[k])) S[k] = []; });
      if (!S.fired || typeof S.fired !== 'object') S.fired = {};
      const ph = o.phone || {};
      S.phone = Object.assign(defaults().phone, ph);
      if (!Array.isArray(S.phone.people)) S.phone.people = [];
      if (ph.topic && !S.phone.people.length) { S.phone.people.push({ id: 'p' + uid(), name: 'Mi celular', topic: ph.topic, on: true }); S.phone.sched = {}; }
      delete S.phone.topic;
      S.sync = Object.assign(defaults().sync, o.sync || {});
      ['upd', 'sig', 'del', 'bupd', 'bsig'].forEach(k => { if (!S.sync[k] || typeof S.sync[k] !== 'object') S.sync[k] = {}; });
      if (!S.phone.sched || typeof S.phone.sched !== 'object') S.phone.sched = {};
      if (!Array.isArray(S.categories) || !S.categories.length) S.categories = defaults().categories;
      return;
    } catch (e) {
      console.warn('Datos ilegibles, se guardó una copia en :corrupt', e);
      try { localStorage.setItem(KEY + ':corrupt', raw); } catch (_) { }
    }
  }
  S = defaults();
  seed();
}

function save(quiet) {
  if (!storageOK) return;
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { storageOK = false; toast('No se pudo guardar en este navegador. Usa «Exportar copia» para no perder datos.', { ms: 8000 }); }
  if (quiet) return;
  if (S.phone && S.phone.on) phoneSoon();
  if (S.sync && S.sync.on) syncSoon();
}
let saveTimer;
const saveSoon = () => { clearTimeout(saveTimer); saveTimer = setTimeout(save, 350); };
const snapshot = () => JSON.stringify({ events: S.events, tasks: S.tasks, notes: S.notes });
function restore(snap) { const o = JSON.parse(snap); S.events = o.events; S.tasks = o.tasks; S.notes = o.notes; save(); render(); }

function seed() {
  const t = today();
  S.events.push(
    { id: uid(), demo: true, title: 'Ejemplo · Reunión de equipo', date: addDays(t, 1), endDate: addDays(t, 1), allDay: false, start: '10:00', end: '11:00', cat: 'trabajo', repeat: 'none', reminders: [], location: 'Sala 2', notes: '' },
    { id: uid(), demo: true, title: 'Ejemplo · Cumpleaños de Ana', date: addDays(t, 3), endDate: addDays(t, 3), allDay: true, start: '', end: '', cat: 'familia', repeat: 'yearly', reminders: [], location: '', notes: '' },
    { id: uid(), demo: true, title: 'Ejemplo · Gimnasio', date: t, endDate: t, allDay: false, start: '18:00', end: '19:00', cat: 'salud', repeat: 'weekly', reminders: [], location: '', notes: '' }
  );
  S.tasks.push(
    { id: uid(), demo: true, text: 'Ejemplo · Explorar Calendario Pro', done: false, date: t, time: '', remind: null, priority: 1, cat: '', notes: '' },
    { id: uid(), demo: true, text: 'Ejemplo · Escribir mis primeras notas', done: false, date: '', time: '', remind: null, priority: 0, cat: '', notes: '' }
  );
  S.notes.push({
    id: uid(), demo: true, pinned: true, created: Date.now(), updated: Date.now(),
    title: 'Bienvenido a Calendario Pro',
    body: 'Esta es una nota de ejemplo. Puedes borrarla cuando quieras.\n\nCÓMO USARLO\n• Escribe en la barra de arriba: «Dentista mañana 4pm» o «Reunión el viernes 10am cada semana».\n• Haz clic en un día para crear un evento. Arrastra un evento para moverlo a otro día.\n• Cada evento puede tener varios recordatorios (5 min, 1 hora, 1 día antes…).\n• Activa las notificaciones del navegador para que te avise aunque estés en otra pestaña.\n• Los recordatorios funcionan mientras esta página esté abierta (puede estar minimizada).\n\nATAJOS\nN nuevo evento · T hoy · M / S / D / A vistas · ← → navegar · / buscar · Q escribir rápido\n\nEN OTRO COMPUTADOR\nAjustes → «Exportar copia» y luego «Importar» en el otro equipo. O sube esta carpeta a un hosting gratuito (GitHub Pages, Netlify) y ábrela desde cualquier lugar.\n\nLos eventos, tareas y notas marcados como «Ejemplo» se quitan desde Ajustes → «Quitar ejemplos».'
  });
}

/* estado de la interfaz (no se guarda) */
const ui = { section: 'calendar', cursor: today(), mini: today().slice(0, 8) + '01', taskFilter: 'pending', noteId: null, noteQuery: '', noteOpen: false, tgTop: null, lastDay: today() };
const narrow = () => window.innerWidth < 700;
const setCursor = d => { ui.cursor = d; ui.mini = d.slice(0, 8) + '01'; };

/* =====================================================================
   Formatos
   ===================================================================== */
function fmtTime(t) {
  if (!t) return '';
  const [h, m] = t.split(':').map(Number);
  if (!S.settings.hour12) return `${pad(h)}:${pad(m)}`;
  return `${h % 12 || 12}:${pad(m)} ${h >= 12 ? 'PM' : 'AM'}`;
}
const fmtHour = h => S.settings.hour12 ? (h === 0 ? '12 AM' : h < 12 ? `${h} AM` : h === 12 ? '12 PM' : `${h - 12} PM`) : `${pad(h)}:00`;
const fmtLong = s => { const d = parseDate(s); return `${DAY_L[d.getDay()]}, ${d.getDate()} de ${MON_L[d.getMonth()]}`; };
const fmtShort = s => { const d = parseDate(s); return `${DAY_S[d.getDay()]} ${d.getDate()} ${MON_S[d.getMonth()]}`; };
function relDay(s) { const n = diffDays(today(), s); return n === 0 ? 'Hoy' : n === 1 ? 'Mañana' : n === -1 ? 'Ayer' : fmtShort(s); }
function human(min) { min = Math.abs(Math.round(min)); if (min < 60) return `${min} min`; if (min < 1440) { const h = Math.floor(min / 60), m = min % 60; return m ? `${h} h ${m} min` : `${h} h`; } const d = Math.round(min / 1440); return d === 1 ? '1 día' : `${d} días`; }
function remLabel(m) {
  if (m === 0) return 'En el momento';
  if (m < 60) return `${m} minutos antes`;
  if (m === 60) return '1 hora antes';
  if (m < 1440) return `${m / 60} horas antes`;
  if (m === 1440) return '1 día antes';
  if (m % 10080 === 0) return m === 10080 ? '1 semana antes' : `${m / 10080} semanas antes`;
  if (m % 1440 === 0) return `${m / 1440} días antes`;
  return `${m} minutos antes`;
}
const startOfWeek = s => { const d = parseDate(s); const diff = (d.getDay() - S.settings.weekStart + 7) % 7; return addDays(s, -diff); };
const catOf = id => S.categories.find(c => c.id === id) || { id: '', name: 'Sin categoría', color: '#64748b' };
const rgba = (hex, a) => { const n = parseInt(hex.replace('#', ''), 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; };
const itemColor = it => it.type === 'event' ? catOf(it.ev.cat).color : (it.task.cat ? catOf(it.task.cat).color : '#64748b');
const cstyle = c => `--c:${c};--cb:${rgba(c, .17)}`;

/* =====================================================================
   Eventos: recurrencia y colección por rango
   ===================================================================== */
const eventSpan = ev => (ev.endDate && ev.endDate > ev.date) ? diffDays(ev.date, ev.endDate) : 0;

/* Fechas (inicio) de las apariciones de un evento cuyo tramo toca [from, to] */
function occurrences(ev, from, to) {
  const span = eventSpan(ev), lo = addDays(from, -span), res = [], ex = ev.exceptions || [];
  const push = d => { if (d >= ev.date && d >= lo && d <= to && !ex.includes(d) && (!ev.until || d <= ev.until)) res.push(d); };
  const r = ev.repeat || 'none';
  if (r === 'none') { push(ev.date); return res; }
  if (r === 'daily' || r === 'weekdays' || r === 'weekly' || r === 'biweekly') {
    const step = (r === 'daily' || r === 'weekdays') ? 1 : r === 'weekly' ? 7 : 14;
    let d = ev.date;
    if (lo > d) d = addDays(d, Math.floor(diffDays(d, lo) / step) * step);
    for (; d <= to; d = addDays(d, step)) {
      if (r === 'weekdays') { const w = parseDate(d).getDay(); if (w === 0 || w === 6) continue; }
      push(d);
    }
    return res;
  }
  const sd = parseDate(ev.date), step = r === 'monthly' ? 1 : 12, ld = parseDate(lo);
  let k = Math.max(0, Math.floor(((ld.getFullYear() - sd.getFullYear()) * 12 + ld.getMonth() - sd.getMonth()) / step) - 1);
  for (; ; k++) {
    const total = sd.getMonth() + k * step;
    const y = sd.getFullYear() + Math.floor(total / 12), m = total % 12;
    const dim = new Date(y, m + 1, 0).getDate();
    const d = fmtDate(new Date(y, m, Math.min(sd.getDate(), dim)));
    if (d > to || k > 20000) break;
    push(d);
  }
  return res;
}

/* Mapa fecha → elementos (eventos y tareas) entre from y to (inclusive) */
function collect(from, to, opts = {}) {
  const map = {}, add = (d, it) => { (map[d] || (map[d] = [])).push(it); };
  const hidden = S.settings.hiddenCats;
  for (const ev of S.events) {
    if (hidden.includes(ev.cat)) continue;
    const span = eventSpan(ev);
    for (const occ of occurrences(ev, from, to)) {
      for (let i = 0; i <= span; i++) {
        const d = addDays(occ, i);
        if (d < from || d > to) continue;
        add(d, { type: 'event', ev, occ, day: d, i, span, band: !!ev.allDay || span > 0 });
      }
    }
  }
  if (opts.tasks !== false && S.settings.showTasks) {
    for (const t of S.tasks) {
      if (!t.date || t.date < from || t.date > to) continue;
      if (t.cat && hidden.includes(t.cat)) continue;
      add(t.date, { type: 'task', task: t, day: t.date, i: 0, span: 0, band: !t.time });
    }
  }
  const key = it => it.band ? (it.type === 'event' ? -2 : -1) : toMin(it.type === 'event' ? (it.ev.start || '00:00') : it.task.time);
  for (const d in map) map[d].sort((a, b) => key(a) - key(b) || (a.type === 'event' ? a.ev.title : a.task.text).localeCompare(b.type === 'event' ? b.ev.title : b.task.text));
  return map;
}

const itemTitle = it => it.type === 'event' ? it.ev.title : it.task.text;

/* =====================================================================
   Interpretación de texto rápido («Dentista mañana 4pm cada semana»)
   ===================================================================== */
function parseQuick(input, opts = {}) {
  let orig = ' ' + String(input).replace(/\s+/g, ' ').trim().replace(/\b([ap])\.\s?m\.?/gi, '$1m') + ' ';
  let low = norm(orig);
  if (low.length !== orig.length) low = orig.toLowerCase();
  const cut = m => { const i = m.index, l = m[0].length; orig = orig.slice(0, i) + ' ' + orig.slice(i + l); low = low.slice(0, i) + ' ' + low.slice(i + l); };
  const find = re => re.exec(low);
  const take = re => { const m = find(re); if (m) cut(m); return m; };
  const r = { kind: opts.task ? 'task' : 'event', title: '', date: null, time: null, repeat: 'none', remind: null, cat: null };
  const now = new Date(), t0 = fmtDate(now);
  let m, wdRepeat = null, meridiem = false, lead0 = false;

  if (take(/^\s*(?:tarea|todo|pendiente)\s*[:\-]\s*/) || take(/^\s*tarea\s+/)) r.kind = 'task';
  if ((m = find(/\s#([a-z0-9_]+)/))) { const c = S.categories.find(c => norm(c.name).startsWith(m[1])); if (c) { r.cat = c.id; cut(m); } }
  take(/\b(?:recuerdame|recordarme|avisame|avisarme|agendame|agendar)(?:\s+que)?\b/);
  take(/\bcon\s+recordatorio\b/);

  if ((m = take(/\b(?:con\s+)?(\d+)\s*(minutos?|mins?|horas?|hrs?|h|dias?)\s+(?:de\s+)?(?:antes|anticipacion)\b/))) {
    const n = +m[1], u = m[2]; r.remind = /^d/.test(u) ? n * 1440 : /^h/.test(u) ? n * 60 : n;
  }

  if (take(/\b(?:de lunes a viernes|entre semana|dias laborales|dias habiles)\b/)) r.repeat = 'weekdays';
  else if (take(/\b(?:cada 2 semanas|cada dos semanas|quincenal(?:mente)?|cada quincena)\b/)) r.repeat = 'biweekly';
  else if ((m = take(/\b(?:cada|todos los|todas las)\s+(dias?|semanas?|mes(?:es)?|anos?|lunes|martes|miercoles|jueves|viernes|sabados?|domingos?)\b/))) {
    const u = m[1];
    if (/^dia/.test(u)) r.repeat = 'daily'; else if (/^semana/.test(u)) r.repeat = 'weekly';
    else if (/^mes/.test(u)) r.repeat = 'monthly'; else if (/^ano/.test(u)) r.repeat = 'yearly';
    else { r.repeat = 'weekly'; wdRepeat = WDN.findIndex(w => u.startsWith(w)); }
  } else if ((m = take(/\b(diariamente|diario|semanalmente|semanal|mensualmente|mensual|anualmente|anual)\b/))) {
    r.repeat = /^d/.test(m[1]) ? 'daily' : /^s/.test(m[1]) ? 'weekly' : /^me/.test(m[1]) ? 'monthly' : 'yearly';
  }

  if ((m = take(/\ben\s+(\d+)\s*(minutos?|mins?|horas?|hrs?|dias?|semanas?)\b/))) {
    const n = +m[1], u = m[2], d = new Date(now);
    if (/^min/.test(u) || /^h/.test(u)) {
      if (/^min/.test(u)) d.setMinutes(d.getMinutes() + n); else d.setHours(d.getHours() + n);
      r.date = fmtDate(d); r.time = `${pad(d.getHours())}:${pad(d.getMinutes())}`; meridiem = true;
    } else r.date = addDays(t0, /^d/.test(u) ? n : n * 7);
  }

  const setTime = (hs, mi, suf) => {
    let h = +hs; suf = suf || ''; lead0 = hs.length === 2 && hs[0] === '0';
    if (h > 23) return false;
    if (/noche/.test(suf) && h === 12) h = 0;
    else if (/pm|tarde|noche/.test(suf) && h < 12) h += 12;
    else if (/am|manana|madrugada/.test(suf) && h === 12) h = 0;
    r.time = `${pad(h)}:${pad(+mi || 0)}`; meridiem = meridiem || !!suf || h > 12;
    return true;
  };
  const SUF = String.raw`(?:\s*(am|pm|de la manana|de la tarde|de la noche|de la madrugada))?`;
  if (r.time == null) {
    if ((m = find(new RegExp(String.raw`\ba\s+las?\s+(\d{1,2})(?:[:h](\d{2}))?(?!\d)` + SUF))) && setTime(m[1], m[2], m[3])) cut(m);
    else if ((m = find(new RegExp(String.raw`\b(\d{1,2})[:h](\d{2})(?!\d)` + SUF))) && setTime(m[1], m[2], m[3])) cut(m);
    else if ((m = find(/\b(\d{1,2})\s*(am|pm|de la manana|de la tarde|de la noche)(?![a-z])/)) && setTime(m[1], 0, m[2])) cut(m);
    else if ((m = take(/\bmediodia\b/))) { r.time = '12:00'; meridiem = true; }
    else if ((m = take(/\bmedianoche\b/))) { r.time = '00:00'; meridiem = true; }
  }

  let period = null;
  if ((m = take(/\besta\s+(manana|tarde|noche)\b/))) { period = m[1]; if (!r.date) r.date = t0; }
  else if ((m = take(/\b(?:por|de|en)\s+la\s+(manana|tarde|noche)\b/))) period = m[1];
  if (r.time != null && !meridiem) {
    const h = +r.time.slice(0, 2);
    if ((period === 'tarde' || period === 'noche') && h < 12) r.time = plus(r.time, 720);
    else if (!period && !lead0 && h >= 1 && h <= 6) r.time = plus(r.time, 720);
  } else if (r.time == null && period) r.time = { manana: '09:00', tarde: '15:00', noche: '20:00' }[period];

  if (take(/\bpasado\s+manana\b/)) r.date = addDays(t0, 2);
  else if (take(/\bmanana\b/)) r.date = addDays(t0, 1);
  else if (take(/\bhoy\b/)) r.date = t0;

  if ((m = take(/\b(?:(?:el|este|proximo|siguiente)\s+)*(lunes|martes|miercoles|jueves|viernes|sabado|domingo)\b/))) {
    if (!r.date) { const wd = WDN.indexOf(m[1]); let add = (wd - now.getDay() + 7) % 7; if (add === 0) add = 7; r.date = addDays(t0, add); }
  }
  if (wdRepeat != null && wdRepeat >= 0 && !r.date) {
    let add = (wdRepeat - now.getDay() + 7) % 7;
    if (add === 0 && r.time && toMin(r.time) <= nowMin()) add = 7;
    r.date = addDays(t0, add);
  }

  if (!r.date) {
    if ((m = find(/\b(\d{1,2})[\/-](\d{1,2})(?:[\/-](\d{2,4}))?\b/)) && +m[1] >= 1 && +m[1] <= 31 && +m[2] >= 1 && +m[2] <= 12) {
      const y = m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : now.getFullYear();
      let d = new Date(y, +m[2] - 1, +m[1]); if (!m[3] && fmtDate(d) < t0) d = new Date(y + 1, +m[2] - 1, +m[1]);
      r.date = fmtDate(d); cut(m);
    } else if ((m = find(/\b(?:el\s+)?(\d{1,2})\s+de\s+(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre)(?:\s+(?:de|del)\s+(\d{4}))?\b/)) && +m[1] >= 1 && +m[1] <= 31) {
      const mo = MON_L.findIndex(x => x.startsWith(m[2].slice(0, 3))), y = m[3] ? +m[3] : now.getFullYear();
      let d = new Date(y, mo, +m[1]); if (!m[3] && fmtDate(d) < t0) d = new Date(y + 1, mo, +m[1]);
      r.date = fmtDate(d); cut(m);
    } else if ((m = find(/\bel\s+(\d{1,2})\b(?!\s*[:h\/])/)) && +m[1] >= 1 && +m[1] <= 31) {
      let d = new Date(now.getFullYear(), now.getMonth(), +m[1]);
      if (fmtDate(d) < t0) d = new Date(now.getFullYear(), now.getMonth() + 1, +m[1]);
      r.date = fmtDate(d); cut(m);
    }
  }

  let t = orig.replace(/\s+/g, ' ').trim();
  t = t.replace(/^(?:recu[eé]rdame|recordarme|agendar|agenda|programar|programa|anota|apunta|apuntar|a[ñn]adir|crear|nueva? (?:cita|evento|tarea))\s+(?:que\s+)?/i, '');
  let prev;
  do {
    prev = t;
    t = t.replace(/^(?:a|para|que|y|de|del|en|por)\s+/i, '').replace(/\s+(?:el|la|los|las|a|para|de|del|en|por|que|y|con|hoy)$/i, '').replace(/^[\s,.;:\-–]+|[\s,.;:\-–]+$/g, '');
  } while (t !== prev);
  r.title = t ? cap(t) : '';
  return r;
}

/* completa lo que falta (fecha por defecto, recordatorios) para crear un evento desde texto rápido */
function quickEventData(p) {
  let date = p.date;
  if (!date) date = p.time ? (toMin(p.time) > nowMin() ? today() : addDays(today(), 1)) : ui.cursor;
  const allDay = !p.time;
  const rems = p.remind != null ? [p.remind] : defaultRems(allDay);
  return { title: p.title, date, endDate: date, allDay, start: p.time || '', end: p.time ? plus(p.time, 60) : '', cat: p.cat || S.settings.lastCat || S.categories[0].id, repeat: p.repeat || 'none', until: '', reminders: rems, location: '', notes: '' };
}
const defaultRems = allDay => S.settings.defaultReminder == null ? [] : (allDay ? [0] : [S.settings.defaultReminder]);

function previewHTML(p, isTask) {
  if (!p.title && !p.date && !p.time) return '';
  const out = [];
  if (!p.title) out.push(`<span class="qp warn">Falta el título</span>`);
  if (isTask) {
    out.push(`<span class="qp t">${ic('tasks', 'sm')} Tarea</span>`);
    if (p.date) out.push(`<span class="qp">${ic('cal', 'sm')} ${esc(fmtLong(p.date))}</span>`);
    if (p.time) out.push(`<span class="qp">${ic('clock', 'sm')} ${fmtTime(p.time)}</span>`);
  } else {
    const d = quickEventData(p);
    out.push(`<span class="qp">${ic('cal', 'sm')} ${esc(fmtLong(d.date))}</span>`);
    out.push(`<span class="qp">${ic('clock', 'sm')} ${p.time ? fmtTime(p.time) + ' – ' + fmtTime(d.end) : 'Todo el día'}</span>`);
    if (d.repeat !== 'none') out.push(`<span class="qp">${ic('repeat', 'sm')} ${REPEAT_TXT[d.repeat]}</span>`);
    if (d.reminders.length) out.push(`<span class="qp">${ic('bell', 'sm')} ${esc(d.reminders.map(remLabel).join(', '))}</span>`);
    out.push(`<span class="qp t">${esc(catOf(d.cat).name)}</span>`);
    out.push(`<span class="hint" style="align-self:center">Enter guarda · Shift+Enter abre el formulario</span>`);
  }
  if (isTask && p.remind != null) out.push(`<span class="qp">${ic('bell', 'sm')} ${esc(remLabel(p.remind))}</span>`);
  return out.join('');
}

/* =====================================================================
   Vistas
   ===================================================================== */
function chipHTML(it) {
  const c = itemColor(it);
  if (it.type === 'event') {
    const ev = it.ev, tm = (!it.band && ev.start) ? `<span class="tm">${fmtTime(ev.start)}</span>` : '';
    return `<div class="chip${it.i > 0 ? ' cont' : ''}" draggable="true" data-act="open-event" data-id="${ev.id}" data-occ="${it.occ}" style="${cstyle(c)}" title="${esc(ev.title)}">${tm}${esc(ev.title)}</div>`;
  }
  const t = it.task;
  return `<div class="chip task${t.done ? ' done' : ''}" draggable="true" data-act="open-task" data-id="${t.id}" style="${cstyle(c)}" title="${esc(t.text)}"><span class="tk" data-act="toggle-task" data-id="${t.id}"></span>${t.time ? `<span class="tm">${fmtTime(t.time)}</span>` : ''}${esc(t.text)}</div>`;
}

function timeLabel(it) {
  if (it.type === 'task') return it.task.time ? fmtTime(it.task.time) : 'Tarea';
  const ev = it.ev;
  if (ev.allDay) return it.span ? `Día ${it.i + 1} de ${it.span + 1}` : 'Todo el día';
  if (it.span) return it.i === 0 ? `Desde ${fmtTime(ev.start)}` : it.i === it.span ? `Hasta ${fmtTime(ev.end)}` : 'Todo el día';
  return `${fmtTime(ev.start)}${ev.end ? ' – ' + fmtTime(ev.end) : ''}`;
}

function rowHTML(it) {
  const c = itemColor(it);
  if (it.type === 'event') {
    const ev = it.ev, cat = catOf(ev.cat);
    const sub = [cat.name, ev.location ? esc(ev.location) : '', ev.reminders && ev.reminders.length ? '🔔' : ''].filter(Boolean).join(' · ');
    return `<div class="row-item" data-act="open-event" data-id="${ev.id}" data-occ="${it.occ}" style="${cstyle(c)}"><span class="bar"></span><div class="rt">${timeLabel(it)}</div><div class="rb"><div class="rtitle">${esc(ev.title)}${ev.repeat && ev.repeat !== 'none' ? ' ' + ic('repeat', 'sm') : ''}</div><div class="rsub">${sub}</div></div></div>`;
  }
  const t = it.task;
  return `<div class="row-item" data-act="open-task" data-id="${t.id}" style="${cstyle(c)}"><span class="bar"></span><div class="rt">${timeLabel(it)}</div><button class="cb${t.done ? ' on' : ''}" data-act="toggle-task" data-id="${t.id}" aria-label="Completar">${ic('check')}</button><div class="rb"><div class="rtitle${t.done ? ' done' : ''}">${esc(t.text)}</div></div></div>`;
}

function viewMonth() {
  const first = ui.cursor.slice(0, 8) + '01', gs = startOfWeek(first);
  let days = Array.from({ length: 42 }, (_, i) => addDays(gs, i));
  if (parseDate(days[35]).getMonth() !== parseDate(first).getMonth()) days = days.slice(0, 35);
  const map = collect(days[0], days[days.length - 1]);
  const curM = parseDate(first).getMonth(), t0 = today(), nr = days.length / 7;
  const isN = narrow(), max = isN ? 0 : 8;
  const dow = Array.from({ length: 7 }, (_, i) => DAY_S[(S.settings.weekStart + i) % 7]);
  let h = `<div class="month"><div class="m-dow">${dow.map(x => `<div>${isN ? x.charAt(0) : x}</div>`).join('')}</div><div class="m-grid" style="grid-template-rows:repeat(${nr},minmax(0,1fr))">`;
  for (const d of days) {
    const dt = parseDate(d), items = map[d] || [], shown = items.slice(0, max);
    const label = dt.getDate() === 1 ? `${dt.getDate()} ${MON_S[dt.getMonth()]}` : dt.getDate();
    h += `<div class="cell${dt.getMonth() !== curM ? ' other' : ''}${d === t0 ? ' today' : ''}${d === ui.cursor ? ' sel' : ''}" data-act="cell" data-date="${d}" data-n="${items.length}">
      <div class="cell-head"><span class="dnum" data-act="goto-day" data-date="${d}">${label}</span></div>
      <div class="chips">${shown.map(chipHTML).join('')}</div>
      ${!isN && items.length ? `<div class="more" hidden data-act="goto-day" data-date="${d}"></div>` : ''}
      ${isN && items.length ? `<div class="dots">${items.slice(0, 4).map(it => `<u style="--c:${itemColor(it)}"></u>`).join('')}</div>` : ''}
    </div>`;
  }
  h += '</div></div>';
  if (isN) {
    const list = (map[ui.cursor] || (ui.cursor < days[0] || ui.cursor > days[days.length - 1] ? [] : []));
    h += `<div class="ag-day"><div class="ag-h${ui.cursor === t0 ? ' today' : ''}">${cap(fmtLong(ui.cursor))}</div>${list.length ? `<div class="ag-list">${list.map(rowHTML).join('')}</div>` : `<div class="empty" style="padding:24px">Nada este día</div>`}</div>`;
  }
  return h;
}

function layoutColumns(list) {
  list.sort((a, b) => a.s - b.s || b.e - a.e);
  let group = [], groupEnd = -1, colEnds = [];
  const flush = () => { const n = colEnds.length; group.forEach(x => x.cols = n); group = []; colEnds = []; groupEnd = -1; };
  for (const x of list) {
    if (group.length && x.s >= groupEnd) flush();
    let c = colEnds.findIndex(end => end <= x.s);
    if (c < 0) { c = colEnds.length; colEnds.push(0); }
    colEnds[c] = x.e; x.col = c; group.push(x); groupEnd = Math.max(groupEnd, x.e);
  }
  flush();
}

function blocksHTML(items) {
  const list = items.filter(it => !it.band).map(it => {
    const st = it.type === 'event' ? it.ev.start : it.task.time;
    const s = toMin(st);
    let e = it.type === 'event' ? (it.ev.end ? toMin(it.ev.end) : s + 60) : s + 30;
    if (e <= s) e = Math.min(s + 45, 1440);
    return { it, s, e };
  });
  layoutColumns(list);
  return list.map(x => {
    const it = x.it, c = itemColor(it), top = x.s / 60 * HH, hgt = Math.max((x.e - x.s) / 60 * HH - 2, 20);
    const left = x.col / x.cols * 100, w = 100 / x.cols;
    const st = `${cstyle(c)};top:${top}px;height:${hgt}px;left:calc(${left}% + 1px);width:calc(${w}% - 3px)`;
    if (it.type === 'event') {
      const ev = it.ev;
      return `<div class="blk" data-act="open-event" data-id="${ev.id}" data-occ="${it.occ}" style="${st}"><b>${esc(ev.title)}</b>${hgt > 34 ? `<small>${fmtTime(ev.start)}${ev.end ? ' – ' + fmtTime(ev.end) : ''}${ev.location ? ' · ' + esc(ev.location) : ''}</small>` : ''}</div>`;
    }
    const t = it.task;
    return `<div class="blk${t.done ? ' done' : ''}" data-act="open-task" data-id="${t.id}" style="${st}"><b>☐ ${esc(t.text)}</b></div>`;
  }).join('');
}

function viewTime(days) {
  const map = collect(days[0], days[days.length - 1]), t0 = today(), n = days.length;
  let h = `<div class="tg"><div class="tg-scroll" id="tgScroll" style="--n:${n}">`;
  h += `<div class="tg-row tg-head"><div></div>${days.map(d => { const dt = parseDate(d); return `<div class="tg-day${d === t0 ? ' today' : ''}" data-act="goto-day" data-date="${d}"><span class="dw">${DAY_S[dt.getDay()]}</span><span class="dn">${dt.getDate()}</span></div>`; }).join('')}</div>`;
  h += `<div class="tg-row tg-allday"><div class="gut">todo el día</div>${days.map(d => `<div class="ad-col" data-act="new-event-day" data-date="${d}">${(map[d] || []).filter(it => it.band).map(chipHTML).join('')}</div>`).join('')}</div>`;
  h += `<div class="tg-row tg-grid"><div class="gut">${Array.from({ length: 23 }, (_, i) => `<span class="hl" style="top:${(i + 1) * HH}px">${fmtHour(i + 1)}</span>`).join('')}</div>`;
  h += days.map(d => `<div class="tg-col${d === t0 ? ' today' : ''}" data-act="slot" data-date="${d}">${blocksHTML(map[d] || [])}${d === t0 ? `<div class="nowline" id="nowline" style="top:${nowMin() / 60 * HH}px"></div>` : ''}</div>`).join('');
  h += '</div></div></div>';
  return h;
}

function viewAgenda() {
  const from = ui.cursor, to = addDays(from, 29), map = collect(from, to), t0 = today();
  const keys = Object.keys(map).sort();
  if (!keys.length) return `<div class="empty">${ic('cal')}<div><b>Nada programado</b> del ${fmtShort(from)} al ${fmtShort(to)}</div><p>Escribe arriba, por ejemplo «Llamar al médico mañana 9am».</p></div>`;
  return `<div style="padding-bottom:20px">${keys.map(d => `<div class="ag-day"><div class="ag-h${d === t0 ? ' today' : ''}">${cap(relDay(d) === fmtShort(d) ? fmtLong(d) : relDay(d))} <small>${relDay(d) === fmtShort(d) ? '' : fmtLong(d)}</small></div><div class="ag-list">${map[d].map(rowHTML).join('')}</div></div>`).join('')}</div>`;
}

function calTitle() {
  const v = S.settings.view, d = parseDate(ui.cursor);
  if (v === 'month') return `${cap(MON_L[d.getMonth()])} ${d.getFullYear()}`;
  if (v === 'day') return `${cap(DAY_L[d.getDay()])}, ${d.getDate()} de ${MON_L[d.getMonth()]} ${d.getFullYear()}`;
  const a = v === 'week' ? startOfWeek(ui.cursor) : ui.cursor, b = addDays(a, v === 'week' ? 6 : 29);
  const da = parseDate(a), db = parseDate(b);
  return `${da.getDate()}${da.getMonth() !== db.getMonth() ? ' ' + MON_S[da.getMonth()] : ''} – ${db.getDate()} ${MON_S[db.getMonth()]} ${db.getFullYear()}`;
}

function viewCalendar() {
  const v = S.settings.view;
  if (v === 'month') return viewMonth();
  if (v === 'week') { const s = startOfWeek(ui.cursor); return viewTime(Array.from({ length: 7 }, (_, i) => addDays(s, i))); }
  if (v === 'day') return viewTime([ui.cursor]);
  return viewAgenda();
}

/* tareas */
const taskSort = (a, b) => (a.date || '9999').localeCompare(b.date || '9999') || (a.time || '99').localeCompare(b.time || '99') || (b.priority || 0) - (a.priority || 0);
function taskRowHTML(t) {
  const t0 = today(), over = !t.done && t.date && (t.date < t0 || (t.date === t0 && t.time && toMin(t.time) < nowMin()));
  const chips = [];
  if (t.date) chips.push(`<span class="tc${over ? ' over' : ''}">${ic('cal', 'sm')} ${relDay(t.date)}${t.time ? ' · ' + fmtTime(t.time) : ''}</span>`);
  if (t.remind != null && t.date) chips.push(`<span class="tc">${ic('bell', 'sm')} ${remLabel(t.remind)}</span>`);
  if (t.priority) chips.push(`<span class="tc p${t.priority}">${ic('flag', 'sm')} ${t.priority === 2 ? 'Alta' : 'Media'}</span>`);
  if (t.cat) chips.push(`<span class="tc" style="color:${catOf(t.cat).color}">● ${esc(catOf(t.cat).name)}</span>`);
  return `<div class="row-item" data-act="open-task" data-id="${t.id}" style="${cstyle(t.cat ? catOf(t.cat).color : '#64748b')}"><button class="cb${t.done ? ' on' : ''}" data-act="toggle-task" data-id="${t.id}" aria-label="Completar tarea">${ic('check')}</button><div class="rb"><div class="rtitle${t.done ? ' done' : ''}">${esc(t.text)}</div>${chips.length ? `<div class="tchips">${chips.join('')}</div>` : ''}</div><button class="icon-btn sm" data-act="task-del" data-id="${t.id}" aria-label="Eliminar">${ic('trash', 'sm')}</button></div>`;
}
function viewTasks() {
  const t0 = today(), f = ui.taskFilter;
  const pend = S.tasks.filter(t => !t.done).sort(taskSort), done = S.tasks.filter(t => t.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
  let h = '<div class="pad">';
  const group = (title, list, cls = '') => list.length ? `<div class="task-h ${cls}">${title} · ${list.length}</div><div class="ag-list">${list.map(taskRowHTML).join('')}</div>` : '';
  if (f === 'done') h += done.length ? group('Completadas', done) : `<div class="empty">${ic('tasks')}<div>Aún no has completado tareas</div></div>`;
  else {
    const over = pend.filter(t => t.date && t.date < t0), td = pend.filter(t => t.date === t0), up = pend.filter(t => t.date > t0), nod = pend.filter(t => !t.date);
    h += group('Vencidas', over, 'over') + group('Hoy', td) + group('Próximas', up) + group('Sin fecha', nod);
    if (!pend.length) h += `<div class="empty">${ic('tasks')}<div><b>Todo al día</b></div><p>Agrega una tarea arriba.</p></div>`;
    if (f === 'all') h += group('Completadas', done);
  }
  return h + '</div>';
}

/* notas */
const noteSort = (a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || b.updated - a.updated;
function noteList() { const q = norm(ui.noteQuery || ''); return S.notes.filter(n => !q || norm(n.title + ' ' + n.body).includes(q)).sort(noteSort); }
function noteListHTML(list) {

}
function noteStatus(n) { const w = (n.body.trim().match(/\S+/g) || []).length; return `${w} palabra${w === 1 ? '' : 's'} · Guardado automáticamente`; }
function viewNotes() {

    : `<div class="empty">${ic('note')}<div><b>Sin notas todavía</b></div><p><button class="btn primary" data-act="new-note">${ic('plus')} Nueva nota</button></p></div>`;
  return `<div class="notes${ui.noteOpen ? ' show-editor' : ''}"><div class="n-side"><div class="n-tools"><input id="noteSearch" type="search" placeholder="Buscar en notas" value="${esc(ui.noteQuery)}"><button class="btn primary" data-act="new-note" aria-label="Nueva nota">${ic('plus')}</button></div><div id="nList">${noteListHTML(list)}</div></div><div class="n-main">${ed}</div></div>`;

/* barra lateral */

    <div>${lb ? `Última copia: ${days2 === 0 ? 'hoy' : days2 === 1 ? 'ayer' : 'hace ' + days2 + ' días'}` : (total > 3 ? '⚠ Aún no has hecho copia de seguridad' : 'Datos guardados en este navegador')}</div>
    ${S.sync.on ? `<div id="syncFoot">${syncFootHTML()}</div>` : ''}

const badgeCount = () => { const t0 = today(); return S.tasks.filter(t => !t.done && t.date && t.date <= t0).length; };

/* muestra sólo los eventos que caben en cada celda del mes y resume el resto en «+N más» */
function fitMonth() {
  $$('.m-grid .cell').forEach(c => {
    const chips = $$('.chip', c), more = $('.more', c);
    if (!chips.length) return;
    chips.forEach(x => x.style.display = '');
    const total = +c.dataset.n, avail = c.clientHeight - $('.cell-head', c).offsetHeight - 8, step = chips[0].offsetHeight + 2;
    let k = Math.floor(avail / step);
    if (total > k) k = Math.max(0, Math.floor((avail - 16) / step));
    chips.forEach((x, i) => { x.style.display = i < k ? '' : 'none'; });
    if (more) { more.hidden = total <= k; more.textContent = `+${total - k} más`; }
  });
}

function ask({ title, text, buttons }) {

    openDialog(`<div class="modal"><div class="modal-head"><h2>${esc(title)}</h2></div><div class="modal-body"><p>${text}</p></div><div class="modal-foot">${buttons.map((b, i) => `<button class="btn ${b.cls || ''}" data-i="${i}">${esc(b.label)}</button>`).join('')}</div></div>`, 'sm closable');

function toast(msg, o = {}) {

function importJSON(file) {

}

const icsEsc = s => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
const icsFold = l => { const out = []; while (l.length > 74) { out.push(l.slice(0, 74)); l = ' ' + l.slice(74); } out.push(l); return out.join('\r\n'); };
const icsD = s => s.replace(/-/g, '');
const icsDT = (s, t) => `${icsD(s)}T${(t || '00:00').replace(':', '')}00`;
function exportICS() {
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Calendario Pro//ES', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:Calendario Pro'];
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  for (const ev of S.events) {
    L.push('BEGIN:VEVENT', `UID:${ev.id}@calendariopro`, `DTSTAMP:${stamp}`, `SUMMARY:${icsEsc(ev.title)}`);
    const end = ev.endDate || ev.date;
    if (ev.allDay) L.push(`DTSTART;VALUE=DATE:${icsD(ev.date)}`, `DTEND;VALUE=DATE:${icsD(addDays(end, 1))}`);
    else L.push(`DTSTART:${icsDT(ev.date, ev.start)}`, `DTEND:${icsDT(end, ev.end || plus(ev.start || '00:00', 60))}`);
    const R = { daily: 'FREQ=DAILY', weekdays: 'FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR', weekly: 'FREQ=WEEKLY', biweekly: 'FREQ=WEEKLY;INTERVAL=2', monthly: 'FREQ=MONTHLY', yearly: 'FREQ=YEARLY' }[ev.repeat];
    if (R) L.push(`RRULE:${R}${ev.until ? ';UNTIL=' + icsD(ev.until) + (ev.allDay ? '' : 'T235959') : ''}`);
    (ev.exceptions || []).forEach(x => L.push(ev.allDay ? `EXDATE;VALUE=DATE:${icsD(x)}` : `EXDATE:${icsDT(x, ev.start)}`));
    if (ev.location) L.push(`LOCATION:${icsEsc(ev.location)}`);
    if (ev.notes) L.push(`DESCRIPTION:${icsEsc(ev.notes)}`);
    (ev.reminders || []).forEach(m => L.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(ev.title)}`, `TRIGGER:-PT${m}M`, 'END:VALARM'));
    L.push('END:VEVENT');
  }
  L.push('END:VCALENDAR');
  download(`calendario-pro-${today()}.ics`, L.map(icsFold).join('\r\n'), 'text/calendar');
  toast('Archivo .ics descargado (Google Calendar, Outlook, Apple…)');
}
