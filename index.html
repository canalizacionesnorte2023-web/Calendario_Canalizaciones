const alerts = [];
let audio;
function unlockAudio() { try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === 'suspended') audio.resume(); } catch (e) { } }
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, unlockAudio, { passive: true }));
function beep() {
  if (!S.settings.sound || !audio) return;
  try {
    const t = audio.currentTime;
    [0, .22, .44, .9, 1.12, 1.34].forEach((o, i) => {
      const osc = audio.createOscillator(), g = audio.createGain();
      osc.type = 'sine'; osc.frequency.value = [880, 880, 1175, 880, 880, 1175][i];
      g.gain.setValueAtTime(0, t + o); g.gain.linearRampToValueAtTime(.28, t + o + .02); g.gain.exponentialRampToValueAtTime(.0001, t + o + .2);
      osc.connect(g); g.connect(audio.destination); osc.start(t + o); osc.stop(t + o + .22);
    });
  } catch (e) { }
}

function itemStartMs(dateStr, time) {
  const d = parseDate(dateStr);
  if (time) { const [h, m] = time.split(':').map(Number); d.setHours(h, m, 0, 0); } else d.setHours(+S.settings.allDayHour || 0, 0, 0, 0);
  return d.getTime();
}

function alertSub(a) {
  const diff = (a.when - Date.now()) / 60000;
  const when = `${relDay(a.date)}${a.time ? ' · ' + fmtTime(a.time) : ''}`;
  const rel = diff > 1 ? `en ${human(diff)}` : diff >= -1 ? 'ahora' : `empezó hace ${human(diff)}`;
  return `${when} — ${rel}`;
}

function raiseAlert(info, silent) {
  const a = Object.assign({ aid: uid() }, info);
  alerts.unshift(a);
  renderAlerts();
  if (!silent) { beep(); systemNotify(a); }
}

function systemNotify(a) {
  if (!S.settings.notify || !('Notification' in window) || Notification.permission !== 'granted') return;
  const opts = { body: alertSub(a), tag: a.key || a.aid, requireInteraction: true, icon: 'icon.svg' };
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.ready.then(r => r.showNotification(a.title, opts)).catch(() => { });
    else { const n = new Notification(a.title, opts); n.onclick = () => { window.focus(); n.close(); }; }
  } catch (e) { }
}

function renderAlerts() {
  $('#alerts').innerHTML = alerts.map(a => `<div class="alert" style="--c:${a.color || '#4f6bff'}" data-aid="${a.aid}"><div class="ah"><span class="bell">${ic('bell')}</span><div style="flex:1;min-width:0"><div class="at">${esc(a.title)}</div><div class="as" data-sub>${esc(alertSub(a))}</div></div><button class="icon-btn sm" data-act="al-dismiss" data-aid="${a.aid}" aria-label="Descartar">${ic('x', 'sm')}</button></div>
    <div class="ab"><span class="lbl2">Posponer</span><button class="btn" data-act="al-snooze" data-aid="${a.aid}" data-min="5">5 min</button><button class="btn" data-act="al-snooze" data-aid="${a.aid}" data-min="15">15 min</button><button class="btn" data-act="al-snooze" data-aid="${a.aid}" data-min="60">1 h</button>${a.kind === 'task' ? `<button class="btn primary" data-act="al-done" data-aid="${a.aid}">Hecha</button>` : ''}<button class="btn" data-act="al-wa" data-aid="${a.aid}">WhatsApp</button><button class="btn" data-act="al-open" data-aid="${a.aid}">Abrir</button></div></div>`).join('');
  document.title = (alerts.length ? `(${alerts.length}) ` : '') + 'Calendario Pro';
}

function checkReminders() {
  const now = Date.now(), t0 = today(), from = addDays(t0, -2), to = addDays(t0, 9);
  let changed = false;
  const fire = (key, ms, endMs, info) => {
    if (S.fired[key]) return;
    S.fired[key] = now; changed = true;
    if (now > endMs + 36e5) return;
    raiseAlert(Object.assign({ key, when: ms }, info));
  };
  for (const ev of S.events) {
    if (!ev.reminders || !ev.reminders.length) continue;
    const span = eventSpan(ev);
    for (const occ of occurrences(ev, from, to)) {
      const start = itemStartMs(occ, ev.allDay ? null : ev.start);
      const end = ev.allDay ? itemStartMs(addDays(occ, span), null) + 6 * 36e5 : (span ? itemStartMs(addDays(occ, span), ev.end || ev.start) : (ev.end ? itemStartMs(occ, ev.end) : start + 36e5));
      for (const m of ev.reminders) {
        const at = start - m * 60000;
        if (at <= now && now - at <= DAY_MS) fire(`e|${ev.id}|${occ}|${ev.allDay ? 'd' : ev.start}|${m}`, start, end, { kind: 'event', refId: ev.id, occ, date: occ, time: ev.allDay ? '' : ev.start, title: ev.title, color: catOf(ev.cat).color });
      }
    }
  }
  for (const t of S.tasks) {
    if (t.done || !t.date || t.remind == null) continue;
    const start = itemStartMs(t.date, t.time || null), at = start - t.remind * 60000;
    if (at <= now && now - at <= DAY_MS) fire(`t|${t.id}|${t.date}|${t.time}|${t.remind}`, start, start + 6 * 36e5, { kind: 'task', refId: t.id, date: t.date, time: t.time, title: t.text, color: t.cat ? catOf(t.cat).color : '#64748b' });
  }
  const due = S.snoozes.filter(z => z.at <= now);
  if (due.length) { S.snoozes = S.snoozes.filter(z => z.at > now); due.forEach(z => raiseAlert(z.info)); changed = true; }
  for (const k in S.fired) if (now - S.fired[k] > 45 * DAY_MS) { delete S.fired[k]; changed = true; }
  if (changed) save();
}

function updateNowLine() { const n = $('#nowline'); if (n) n.style.top = nowMin() / 60 * HH + 'px'; $$('#alerts [data-sub]').forEach((el, i) => { if (alerts[i]) el.textContent = alertSub(alerts[i]); }); }

function tick() {
  checkReminders(); updateNowLine();
  if (S.phone.on && Date.now() - phoneTried > 10 * 60000) phoneSoon();
  if (S.sync.on && !document.hidden && Date.now() - syncTried > 45000) syncSoon(300);
  if (ui.lastDay !== today()) { ui.lastDay = today(); render(); }
}

function startTicker() {
  setInterval(tick, 15000);
  try {
    const w = new Worker(URL.createObjectURL(new Blob(['setInterval(function(){postMessage(1)},10000)'], { type: 'text/javascript' })));
    w.onmessage = tick; w.onerror = () => { };
  } catch (e) { /* sin worker: queda el temporizador normal */ }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
}

/* =====================================================================
   Avisos en el celular (ntfy.sh)
   Cada recordatorio de los próximos ~3 días se programa en ntfy para cada celular
   de la lista; ntfy lo entrega a la hora exacta aunque este computador esté apagado.
   Al editar o borrar un evento se reemplaza o cancela el aviso programado.
   ntfy no usa números de teléfono: cada celular se suscribe a su propio código.
   ===================================================================== */
const PHONE_AHEAD = 71 * 36e5, PHONE_GRACE = 20 * 60000;
let phoneTimer = null, phoneBusy = false, phoneAgain = false, phoneLast = 0, phoneTried = 0, phoneErr = '';
const sleep = ms => new Promise(r => setTimeout(r, ms));
const hash53 = str => {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 4294967296 * (2097151 & h2) + (h1 >>> 0);
};
const phoneSeq = key => 'r' + hash53(key).toString(36);
const rfc2047 = s => '=?UTF-8?B?' + btoa(Array.from(new TextEncoder().encode(s), b => String.fromCharCode(b)).join('')) + '?=';
const validTopic = t => /^[A-Za-z0-9_-]{8,64}$/.test(t || '');
const phoneBase = () => S.phone.server.replace(/\/+$/, '');
const phoneTargets = () => S.phone.people.filter(p => p.on && validTopic(p.topic));
const phoneURL = (p, seq) => `${phoneBase()}/${encodeURIComponent(p.topic)}${seq ? '/' + seq : ''}`;
function randomTopic() {
  const a = new Uint8Array(16);
  if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(a); else a.forEach((_, i) => { a[i] = Math.random() * 256; });
  return 'calpro-' + Array.from(a, b => (b % 36).toString(36)).join('');
}
const newPerson = name => ({ id: 'p' + uid(), name, topic: randomTopic(), on: true });

function phoneBody(dateStr, time, m, at, place) {
  const n = diffDays(fmtDate(new Date(at)), dateStr);
  const day = n === 0 ? 'Hoy' : n === 1 ? 'Mañana' : fmtShort(dateStr);
  const lead = m === 0 ? (time ? 'empieza ahora' : 'es hoy') : `en ${human(m)}`;
  return `${day} · ${time ? fmtTime(time) : 'todo el día'} — ${lead}${place ? '\n📍 ' + place : ''}`;
}

/* avisos que cada celular debería tener programados ahora mismo: seq → {at, kind, title, body, sig} */
function phoneWanted() {
  const now = Date.now(), t0 = today(), from = addDays(t0, -1), to = addDays(t0, 11), want = {};
  const add = (key, at, start, kind, title, body) => {
    if (at > now + PHONE_AHEAD || at < now - 15 * 60000 || start < now) return;
    want[phoneSeq(key)] = { at, kind, title: String(title).slice(0, 120), body, sig: `${at}|${title}|${body}` };
  };
  for (const ev of S.events) {
    if (!ev.reminders || !ev.reminders.length) continue;
    for (const occ of occurrences(ev, from, to)) {
      const start = itemStartMs(occ, ev.allDay ? null : ev.start);
      for (const m of ev.reminders) { const at = start - m * 60000; add(`e:${ev.id}:${occ}:${m}`, at, start, 'event', ev.title, phoneBody(occ, ev.allDay ? '' : ev.start, m, at, ev.location)); }
    }
  }
  for (const t of S.tasks) {
    if (t.done || !t.date || t.remind == null) continue;
    const start = itemStartMs(t.date, t.time || null), at = start - t.remind * 60000;
    add(`t:${t.id}:${t.remind}`, at, start, 'task', t.text, phoneBody(t.date, t.time, t.remind, at, ''));
  }
  return want;
}

const phoneSoon = () => { clearTimeout(phoneTimer); phoneTimer = setTimeout(phoneSync, 2500); };

/* lo programado (sched) está indexado por la URL completa: servidor + código + id del aviso */
async function phoneSync() {
  const P = S.phone;
  if (!P.on) return;
  if (phoneBusy) { phoneAgain = true; return; }
  phoneBusy = true; phoneAgain = false; phoneTried = Date.now(); paintPhone(true);
  let dirty = false, retry = 0;
  try {
    const want = phoneWanted(), jobs = {};
    for (const p of phoneTargets()) for (const seq of Object.keys(want)) jobs[phoneURL(p, seq)] = want[seq];
    for (const url of Object.keys(jobs)) {
      const w = jobs[url], cur = P.sched[url];
      if (cur && cur.sig === w.sig) continue;
      const at = Math.max(w.at, Date.now() + 12000);
      const r = await fetch(url, { method: 'POST', body: w.body, headers: { At: String(Math.round(at / 1000)), Title: rfc2047(w.title), Priority: '4', Tags: w.kind === 'task' ? 'white_check_mark' : 'alarm_clock' } });
      if (!r.ok) throw Object.assign(new Error('http'), { status: r.status });
      P.sched[url] = { at: w.at, sig: w.sig }; dirty = true;
      await sleep(80);
    }
    const now = Date.now();
    for (const url of Object.keys(P.sched)) {
      if (jobs[url]) continue;
      const cur = P.sched[url];
      if (cur.at > now + 30000) {
        const r = await fetch(url, { method: 'DELETE' });
        if (!r.ok && r.status !== 404) throw Object.assign(new Error('http'), { status: r.status });
        delete P.sched[url]; dirty = true; await sleep(80);
      } else if (cur.at < now - PHONE_GRACE) { delete P.sched[url]; dirty = true; }
    }
    phoneErr = ''; phoneLast = Date.now();
  } catch (e) {
    phoneErr = e.status === 429 ? 'El servicio está ocupado; reintentando en unos segundos…'
      : e.status ? `El servicio respondió con error ${e.status}. Revisa los códigos y el servidor en Ajustes.`
        : 'Sin conexión con el servicio; reintentaré en un momento.';
    retry = e.status === 429 ? 30000 : (e.status && e.status < 500 ? 0 : 60000);
  }
  phoneBusy = false;
  if (dirty) save();
  paintPhone(true);
  if (retry) { clearTimeout(phoneTimer); phoneTimer = setTimeout(phoneSync, retry); }
  else if (phoneAgain) phoneSoon();
}

/* cancela en ntfy todo lo programado (al apagar la función o cambiar de servidor) */
async function phoneCancelAll() {
  const now = Date.now(), urls = Object.keys(S.phone.sched).filter(u => S.phone.sched[u].at > now + 30000);
  S.phone.sched = {};
  for (const u of urls) { try { await fetch(u, { method: 'DELETE' }); await sleep(60); } catch (e) { break; } }
}

    toast(r.ok ? `Prueba enviada a «${p.name}»: debería llegar en unos segundos` : `El servicio respondió con error ${r.status}`, { ms: 5000 });
  } catch (e) { toast('No se pudo conectar. ¿Tienes internet?'); }
}

async function phoneChange(el) {
  const P = S.phone, ds = el.dataset;
  if (ds.phone === 'on') {
    if (el.checked) { if (!P.people.length) P.people.push(newPerson('Mi celular')); P.on = true; phoneLast = 0; phoneErr = ''; save(); }
    else { P.on = false; save(); await phoneCancelAll(); save(); }
    paintPhone();
  } else if (ds.phone === 'server') {
    const v = el.value.trim().replace(/\/+$/, '');
    if (!/^https?:\/\/[^\s/]+/i.test(v)) { toast('Dirección del servidor no válida'); el.value = P.server; return; }
    if (v !== P.server) { await phoneCancelAll(); P.server = v; save(); phoneSoon(); }
  } else if (ds.pid) {
    const p = P.people.find(x => x.id === ds.pid); if (!p) return;
    if (ds.pf === 'name') p.name = el.value.trim() || p.name;
    else if (ds.pf === 'on') p.on = el.checked;

      const v = el.value.trim();
      if (!validTopic(v)) { toast('El código debe tener entre 8 y 64 letras, números, - o _'); el.value = p.topic; return; }

    }
    save(); paintPhone();
  }
}

/* =====================================================================
   Sincronización entre computadores
   Los datos viajan cifrados (AES-GCM; la clave solo está en el código de sincronización)
   en un Gist secreto de GitHub. Cada elemento lleva la fecha de su última modificación;
   al sincronizar se mezclan ambos lados: gana lo más reciente y los borrados se propagan.
   ===================================================================== */
const SYNC_FILE = 'calendario-pro.enc.json', SYNC_TOMB_DAYS = 90, SYNC_KINDS = { e: 'events', t: 'tasks', n: 'notes' };
let syncTimer = null, syncBusy = false, syncAgain = false, syncErr = '', syncTried = 0;
const syncSupported = () => !!(window.crypto && crypto.subtle);
const syncApi = () => (S.sync.api || 'https://api.github.com').replace(/\/+$/, '');
const b64enc = bytes => { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); };
const b64dec = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));
const b64url = bytes => b64enc(bytes).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const b64urlDec = s => b64dec(s.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - s.length % 4) % 4));
const hashOf = o => hash53(JSON.stringify(o)).toString(36);
const syncSoon = ms => { if (!S.sync.on) return; clearTimeout(syncTimer); syncTimer = setTimeout(syncRun, ms || 4000); };
const ghFetch = (path, o = {}) => fetch(syncApi() + path, Object.assign({}, o, { headers: Object.assign({ Authorization: 'Bearer ' + S.sync.token, Accept: 'application/vnd.github+json' }, o.headers || {}) }));

const syncKey = () => crypto.subtle.importKey('raw', b64urlDec(S.sync.key), 'AES-GCM', false, ['encrypt', 'decrypt']);
async function syncEncrypt(obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await syncKey(), new TextEncoder().encode(JSON.stringify(obj))));
  return JSON.stringify({ v: 1, iv: b64enc(iv), ct: b64enc(ct) });
}
async function syncDecrypt(text) {
  const o = JSON.parse(text);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64dec(o.iv) }, await syncKey(), b64dec(o.ct))));
}
const syncCode = () => 'cpsync1.' + b64url(new TextEncoder().encode(JSON.stringify({ t: S.sync.token, g: S.sync.gist, k: S.sync.key, a: S.sync.api || undefined })));
function parseSyncCode(code) {
  try {
    const s = String(code).trim(); if (!s.startsWith('cpsync1.')) return null;
    const o = JSON.parse(new TextDecoder().decode(b64urlDec(s.slice(8))));
    return o && o.t && o.g && o.k ? o : null;
  } catch (e) { return null; }
}
function syncReset() { Object.assign(S.sync, { on: false, token: '', gist: '', key: '', api: '', etag: '', last: 0, first: false, pending: false, upd: {}, sig: {}, del: {}, bupd: {}, bsig: {} }); syncErr = ''; }

/* bloques pequeños que se sincronizan enteros (gana el más reciente) */
const syncBlocks = () => ({ cats: S.categories, wa: S.settings.waContacts, people: S.phone.people.map(p => ({ id: p.id, name: p.name, topic: p.topic, on: p.on })) });

/* detecta qué cambió desde la última vez (altas, ediciones y borrados) y le pone fecha */
function syncStamp() {
  const Y = S.sync, now = Date.now(), seen = new Set(); let changed = false;
  for (const ch of Object.keys(SYNC_KINDS)) for (const it of S[SYNC_KINDS[ch]]) {
    if (it.demo) continue;
    const k = ch + ':' + it.id, h = hashOf(it); seen.add(k);
    if (Y.sig[k] !== h) { Y.sig[k] = h; Y.upd[k] = now; delete Y.del[k]; changed = true; }
  }
  for (const k of Object.keys(Y.sig)) if (!seen.has(k)) { delete Y.sig[k]; delete Y.upd[k]; Y.del[k] = now; changed = true; }
  const B = syncBlocks();
  for (const b of Object.keys(B)) { const h = hashOf(B[b]); if (Y.bsig[b] !== h) { Y.bsig[b] = h; Y.bupd[b] = now; changed = true; } }
  for (const k of Object.keys(Y.del)) if (now - Y.del[k] > SYNC_TOMB_DAYS * DAY_MS) delete Y.del[k];
  return changed;
}

function syncLocalPayload() {
  const Y = S.sync, items = {}, blocks = {}, B = syncBlocks();
  for (const ch of Object.keys(SYNC_KINDS)) for (const it of S[SYNC_KINDS[ch]]) { if (!it.demo) items[ch + ':' + it.id] = { u: Y.upd[ch + ':' + it.id] || 0, x: it }; }
  for (const k of Object.keys(Y.del)) items[k] = { u: Y.del[k], del: true };
  for (const b of Object.keys(B)) blocks[b] = { u: Y.bupd[b] || 0, x: B[b] };
  return { v: 1, items, blocks };
}

function syncApplyItem(k, R) {
  const Y = S.sync, arr = S[SYNC_KINDS[k[0]]], id = k.slice(2), i = arr.findIndex(x => x.id === id);
  if (R.del) { if (i >= 0) arr.splice(i, 1); delete Y.sig[k]; delete Y.upd[k]; Y.del[k] = R.u; }
  else { if (i >= 0) arr[i] = R.x; else arr.push(R.x); Y.sig[k] = hashOf(R.x); Y.upd[k] = R.u; delete Y.del[k]; }
}
function syncApplyBlock(b, R) {
  if (b === 'cats' && Array.isArray(R.x) && R.x.length) S.categories = R.x;
  else if (b === 'wa' && Array.isArray(R.x)) S.settings.waContacts = R.x;
  else if (b === 'people' && Array.isArray(R.x)) { const old = new Map(S.phone.people.map(p => [p.id, p])); S.phone.people = R.x.map(p => Object.assign({}, old.get(p.id) || {}, p)); }
  S.sync.bsig[b] = hashOf(syncBlocks()[b]); S.sync.bupd[b] = R.u;
}

/* mezcla lo remoto con lo local. Devuelve {out (lo que debe quedar guardado), toLocal, toRemote} */
function syncMerge(remote) {
  const Y = S.sync, local = syncLocalPayload(), out = { v: 1, items: {}, blocks: {} };
  const rI = (remote && remote.items) || {}, rB = (remote && remote.blocks) || {};
  let toLocal = false, toRemote = false;
  const differs = (a, b) => !a !== !b || (!!a && !!b && (!!a.del !== !!b.del || (!a.del && hashOf(a.x) !== hashOf(b.x))));
  for (const k of new Set([...Object.keys(local.items), ...Object.keys(rI)])) {
    const L = local.items[k], R = rI[k], diff = differs(L, R);
    let win = L || R;
    if (L && R && diff) win = ((Y.first && !L.del && !R.del) || R.u > L.u) ? R : L;
    out.items[k] = win;
    if (diff && win === R) { syncApplyItem(k, R); toLocal = true; }
    if (diff && win === L) toRemote = true;
  }
  for (const b of Object.keys(local.blocks)) {
    const L = local.blocks[b], R = rB[b], diff = !!R && hashOf(R.x) !== hashOf(L.x);
    let win = L;
    if (diff && (Y.first || R.u > L.u)) win = R;
    out.blocks[b] = win;
    if (diff && win === R) { syncApplyBlock(b, R); toLocal = true; }
    if (!R || (diff && win === L)) toRemote = true;
  }
  return { out, toLocal, toRemote };
}

async function syncRun(force) {
  const Y = S.sync;
  if (!Y.on || !Y.token || !Y.gist || !Y.key || !syncSupported()) return;
  if (syncBusy) { syncAgain = true; return; }
  syncBusy = true; syncAgain = false; syncTried = Date.now(); paintSync(true);
  let retry = 0, applied = false;
  try {
    if (syncStamp()) Y.pending = true;
    const h = {}; if (Y.etag && force !== true && !Y.first) h['If-None-Match'] = Y.etag;
    const r = await ghFetch('/gists/' + Y.gist, { headers: h });
    let push = null, etag = Y.etag;
    if (r.status === 304) { if (Y.pending) push = syncLocalPayload(); }
    else if (r.ok) {
      const g = await r.json(), f = g.files && (g.files[SYNC_FILE] || Object.values(g.files)[0]);
      let text = f ? f.content : '';
      if (f && f.truncated) text = await (await fetch(f.raw_url)).text();
      const remote = text ? await syncDecrypt(text) : null;
      etag = r.headers.get('ETag') || '';
      const res = syncMerge(remote);
      applied = res.toLocal; Y.first = false;
      if (res.toRemote || !remote) push = res.out; else Y.pending = false;
    } else throw Object.assign(new Error('http'), { status: r.status });
    if (push) {
      const pr = await ghFetch('/gists/' + Y.gist, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ files: { [SYNC_FILE]: { content: await syncEncrypt(push) } } }) });
      if (!pr.ok) throw Object.assign(new Error('http'), { status: pr.status });
      etag = pr.headers.get('ETag') || ''; Y.pending = false;
    }
    Y.etag = etag; Y.last = Date.now(); syncErr = '';
  } catch (e) {
    syncErr = e.status === 401 ? 'GitHub rechazó el token (¿venció o lo borraste?). Crea uno nuevo y vuelve a conectar.'
      : e.status === 404 ? 'No se encuentra el Gist. ¿Es el código correcto y de la misma cuenta de GitHub?'
        : (e.status === 403 || e.status === 429) ? 'GitHub limitó las consultas por ahora; reintento en unos minutos.'
          : e.name === 'OperationError' ? 'La clave no coincide con los datos guardados (código de otra sincronización).'
            : e.status ? `GitHub respondió con error ${e.status}.` : 'Sin conexión con GitHub; reintentaré en un momento.';
    retry = (e.status === 403 || e.status === 429) ? 300000 : (!e.status && e.name !== 'OperationError') ? 60000 : 0;
  }
  syncBusy = false;
  save(true);
  if (applied) { render(); if (S.phone.on) phoneSoon(); }
  paintSync(true);
  if (retry) { clearTimeout(syncTimer); syncTimer = setTimeout(syncRun, retry); }
  else if (syncAgain) syncSoon(1500);
}

async function syncCreate(token) {
  const Y = S.sync;
  Object.assign(Y, { token, key: b64url(crypto.getRandomValues(new Uint8Array(32))), gist: '', etag: '', first: false, pending: true, upd: {}, sig: {}, del: {}, bupd: {}, bsig: {} });
  syncStamp();
  const r = await ghFetch('/gists', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ description: 'Calendario Pro (datos cifrados; no borrar)', public: false, files: { [SYNC_FILE]: { content: await syncEncrypt(syncLocalPayload()) } } }) });
  if (!r.ok) throw Object.assign(new Error('http'), { status: r.status });
  const g = await r.json(); Y.gist = g.id; Y.etag = r.headers.get('ETag') || ''; Y.on = true; Y.pending = false; Y.last = Date.now();
}
async function syncJoin(code) {
  const o = parseSyncCode(code); if (!o) throw Object.assign(new Error('code'), { msg: 'Ese código no es válido. Cópialo completo desde el otro computador (empieza por cpsync1.).' });
  Object.assign(S.sync, { on: true, token: o.t, gist: o.g, key: o.k, api: o.a || '', etag: '', first: true, pending: false, upd: {}, sig: {}, del: {}, bupd: {}, bsig: {} });
  await syncRun(true);
  if (syncErr) { const m = syncErr; syncReset(); throw Object.assign(new Error('sync'), { msg: m }); }
}

function doSearch(raw) {
  const box = $('#searchRes'), q = norm(raw.trim());
  if (q.length < 2) { box.hidden = true; return; }
  const evs = S.events.filter(e => norm([e.title, e.notes, e.location].join(' ')).includes(q)).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 8);
  const tks = S.tasks.filter(t => norm(t.text + ' ' + (t.notes || '')).includes(q)).slice(0, 6);
  const nts = S.notes.filter(n => norm(n.title + ' ' + n.body).includes(q)).slice(0, 6);
  let h = '';
  if (evs.length) h += `<div class="sr-h">Eventos</div>` + evs.map(e => `<div class="sr-i" data-act="open-event" data-id="${e.id}" data-occ="${e.date}"><span class="up-dot" style="--c:${catOf(e.cat).color}"></span><span>${esc(e.title)}</span><small>${fmtShort(e.date)}${e.repeat !== 'none' ? ' ↻' : ''}</small></div>`).join('');
  if (tks.length) h += `<div class="sr-h">Tareas</div>` + tks.map(t => `<div class="sr-i" data-act="open-task" data-id="${t.id}">${ic('tasks', 'sm')}<span>${esc(t.text)}</span><small>${t.done ? 'hecha' : t.date ? fmtShort(t.date) : ''}</small></div>`).join('');
  if (nts.length) h += `<div class="sr-h">Notas</div>` + nts.map(n => `<div class="sr-i" data-act="open-note" data-id="${n.id}">${ic('note', 'sm')}<span>${esc(n.title || 'Sin título')}</span></div>`).join('');
  box.innerHTML = h || '<div class="empty-s" style="padding:12px">Sin resultados</div>';
  box.hidden = false;
}

  'note-del': () => { const snap = snapshot(); S.notes = S.notes.filter(x => x.id !== ui.noteId); ui.noteId = null; ui.noteOpen = false; save(); render(); toast('Nota eliminada', { undo: snap }); },
  'al-dismiss': el => { const a = findAlert(el); if (a) dropAlert(a); },
  'al-snooze': el => { const a = findAlert(el); if (!a) return; const min = +el.dataset.min, info = Object.assign({}, a); delete info.aid; S.snoozes.push({ at: Date.now() + min * 60000, info }); save(); dropAlert(a); toast(`Te lo recuerdo en ${human(min)}`); },
  'al-done': el => { const a = findAlert(el); if (!a) return; const t = S.tasks.find(x => x.id === a.refId); if (t) { t.done = true; t.doneAt = Date.now(); save(); render(); } dropAlert(a); },
  'al-open': el => { const a = findAlert(el); if (!a) return; if (a.kind === 'task') openTaskModal({ id: a.refId }); else openEventModal({ id: a.refId, occ: a.occ }); dropAlert(a); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!e.target.closest('.search')) closeSearch();
  if (!el) return;
  const fn = A[el.dataset.act];
  if (!fn) return;
  if (e.target.closest('#searchRes')) closeSearch();
  fn(el, e);
});

/* arrastrar y soltar en la vista mensual */
let drag = null;
document.addEventListener('dragstart', e => {
  const c = e.target.closest && e.target.closest('.chip[data-id]'); if (!c) return;
  drag = { id: c.dataset.id, occ: c.dataset.occ, task: c.classList.contains('task') };
  e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', c.dataset.id); } catch (_) { }
});
document.addEventListener('dragover', e => { const c = e.target.closest && e.target.closest('.cell'); if (drag && c) { e.preventDefault(); $$('.cell.drop').forEach(x => x !== c && x.classList.remove('drop')); c.classList.add('drop'); } });
document.addEventListener('dragend', () => { drag = null; $$('.cell.drop').forEach(x => x.classList.remove('drop')); });
document.addEventListener('drop', e => {
  const c = e.target.closest && e.target.closest('.cell'); if (!drag || !c) return;
  e.preventDefault(); const target = c.dataset.date, snap = snapshot();
  if (drag.task) { const t = S.tasks.find(x => x.id === drag.id); if (t && t.date !== target) { t.date = target; save(); render(); toast(`Tarea movida al ${fmtShort(target)}`, { undo: snap }); } }
  else {
    const ev = S.events.find(x => x.id === drag.id), delta = diffDays(drag.occ, target);
    if (ev && delta) { ev.date = addDays(ev.date, delta); if (ev.endDate) ev.endDate = addDays(ev.endDate, delta); if (ev.until) ev.until = addDays(ev.until, delta); save(); render(); toast(`Movido al ${fmtShort(target)}`, { undo: snap }); }
  }
  drag = null;
});

/* entradas de texto (delegadas para sobrevivir a los renders) */
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'quick') $('#quickPrev').innerHTML = previewHTML(parseQuick(e.target.value), false);
  else if (id === 'taskQuick') $('#taskPrev').innerHTML = previewHTML(parseQuick(e.target.value, { task: true }), true);
  else if (id === 'search') doSearch(e.target.value);
  else if (id === 'noteSearch') { ui.noteQuery = e.target.value; $('#nList').innerHTML = noteListHTML(noteList()); }
  else if (id === 'noteTitle' || id === 'noteBody') {
    const n = S.notes.find(x => x.id === ui.noteId); if (!n) return;
    if (id === 'noteTitle') n.title = e.target.value; else n.body = e.target.value;
    delete n.demo; n.updated = Date.now(); saveSoon();
    $('#nList').innerHTML = noteListHTML(noteList()); $('#noteStat').textContent = noteStatus(n);
  }
});
document.addEventListener('change', e => {
  if (e.target.dataset && (e.target.dataset.phone || e.target.dataset.pid)) { phoneChange(e.target); return; }
  if (e.target.dataset && e.target.dataset.wc) { waChange(e.target); return; }
  const k = e.target.dataset && e.target.dataset.set; if (k) {
    let v = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
    if (k === 'weekStart' || k === 'allDayHour') v = +v;
    else if (k === 'hour12') v = v === 'true';
    else if (k === 'defaultReminder') v = v === '' ? null : +v;
    S.settings[k] = v; save(); render(); return;
  }
  if (e.target.dataset && e.target.dataset.cc) { const c = S.categories.find(x => x.id === e.target.dataset.cc); if (c) { c.color = e.target.value; save(); render(); } }
  if (e.target.dataset && e.target.dataset.cn) { const c = S.categories.find(x => x.id === e.target.dataset.cn); if (c) { c.name = e.target.value.trim() || c.name; save(); render(); } }
});
document.addEventListener('keydown', e => {
  const id = e.target.id;
  if (e.key === 'Enter' && id === 'quick') {
    e.preventDefault();
    const v = e.target.value.trim(); if (!v) return;
    const p = parseQuick(v);
    if (!p.title) { toast('Escribe un título para el evento'); return; }
    if (p.kind === 'task') { addQuickTask(p); }
    else if (e.shiftKey || e.altKey) { openEventModal({ prefill: p }); }
    else { const d = quickEventData(p); S.settings.lastCat = d.cat; S.events.push(Object.assign({ id: uid(), created: Date.now() }, d)); save(); setCursor(d.date); render(); toast(`Creado: ${d.title} · ${fmtShort(d.date)}${p.time ? ' ' + fmtTime(p.time) : ''}`); }
    e.target.value = ''; $('#quickPrev').innerHTML = ''; if (e.shiftKey || e.altKey) return;
    return;
  }
  if (e.key === 'Enter' && id === 'taskQuick') {
    e.preventDefault(); const v = e.target.value.trim(); if (!v) return;
    const p = parseQuick(v, { task: true }); if (!p.title) { toast('Escribe qué hay que hacer'); return; }
    addQuickTask(p); e.target.value = ''; $('#taskPrev').innerHTML = ''; return;
  }
  if (e.key === 'Enter' && id === 'search') { const f = $('#searchRes [data-act]'); if (f) f.click(); return; }
  if (e.key === 'Escape') { if (!dlg.open) { closeSearch(); document.body.classList.remove('sb-open'); if (id === 'search') e.target.blur(); } return; }
  const tag = (e.target.tagName || '').toLowerCase();
  if (['input', 'textarea', 'select'].includes(tag) || e.target.isContentEditable || dlg.open || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase(), views = { m: 'month', s: 'week', w: 'week', d: 'day', a: 'agenda' };
  if (k === 'n') { e.preventDefault(); openEventModal({ date: ui.cursor }); }
  else if (k === 't') { setCursor(today()); render(); }
  else if (views[k]) { ui.section = 'calendar'; S.settings.view = views[k]; save(); render(); }
  else if (k === 'arrowleft' && ui.section === 'calendar') nav(-1);
  else if (k === 'arrowright' && ui.section === 'calendar') nav(1);
  else if (k === '/') { e.preventDefault(); $('#search').focus(); }
  else if (k === 'q') { e.preventDefault(); ui.section = 'calendar'; render(); $('#quick').focus(); }
});
function addQuickTask(p) {
  const rem = p.remind != null ? p.remind : (p.date && p.time && S.settings.defaultReminder != null ? S.settings.defaultReminder : null);
  S.tasks.push({ id: uid(), text: p.title, notes: '', done: false, date: p.date || '', time: p.date ? (p.time || '') : '', remind: p.date ? rem : null, priority: 0, cat: p.cat || '', created: Date.now() });
  save(); render(); toast('Tarea agregada');
}

/* archivo oculto para importar */
const fileIn = document.createElement('input'); fileIn.type = 'file'; fileIn.accept = '.json,application/json'; fileIn.id = 'fileIn'; fileIn.hidden = true;
fileIn.addEventListener('change', () => { if (fileIn.files[0]) importJSON(fileIn.files[0]); fileIn.value = ''; });
document.body.appendChild(fileIn);

/* =====================================================================
   Arranque
   ===================================================================== */
window.addEventListener('beforeunload', () => { clearTimeout(saveTimer); save(); });
window.addEventListener('pagehide', () => { clearTimeout(saveTimer); save(); });
window.addEventListener('storage', e => { if (e.key === KEY) { const active = document.activeElement; load(); if (!(active && (active.id === 'noteBody' || active.id === 'noteTitle'))) render(); } });
let rsz; let wasNarrow = narrow();
window.addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(() => { if (narrow() !== wasNarrow) { wasNarrow = narrow(); render(); } else fitMonth(); }, 120); });
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; renderSidebar(); });
window.addEventListener('appinstalled', () => { installEvt = null; renderSidebar(); });
window.addEventListener('online', () => { syncSoon(500); if (S.phone.on) phoneSoon(); });
mq.addEventListener && mq.addEventListener('change', () => { if (S.settings.theme === 'auto') applyTheme(); });

function boot() {
  load();
  $('#newEventBtn').innerHTML = `${ic('plus')} Nuevo evento`;
  $('#menuBtn').innerHTML = ic('menu'); $('#setBtn').innerHTML = ic('sliders'); $('#searchIcon').innerHTML = ic('search');
  $('#prevBtn').innerHTML = ic('left'); $('#nextBtn').innerHTML = ic('right'); $('#fab').innerHTML = ic('plus');
  $('.sb-title .icon-btn').innerHTML = ic('edit', 'sm');
  render();
  if (!storageOK) toast('Este navegador no permite guardar datos. Usa «Exportar copia» para no perder nada.', { ms: 9000 });
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
  if (/^https?:$/.test(location.protocol)) {
    const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.json'; document.head.appendChild(l);
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
  }
  startTicker();
  setTimeout(tick, 800);
}
window.CalPro = { parseQuick, occurrences, collect, tick, save, render, get state() { return S; } };
boot();
})();
</script>
